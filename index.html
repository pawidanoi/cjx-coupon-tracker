        <span class="chip ${closed?'chip-status-closed':'chip-status-'+status}">${closed?'ปิดงานแล้ว':STATUS_LABEL[status]}</span>
        <span class="chip ${p.team?'chip-team':'chip-noteam'}">${p.team ? escapeHtml(p.team) : 'ยังไม่กำหนดทีม'}</span>
        ${p.needsBurmese ? '<span class="chip chip-burmese">ต้องการสื่อพม่า</span>' : ''}
      </div>
      <div class="meta">${fmtDateShort(p.startDate)} – ${fmtDateShort(p.endDate)}</div>
      <div class="bar"><div class="bar-fill ${pct>=100?'full':''}" style="width:${pct}%"></div></div>
      <div class="count-line">เบิกแล้ว ${p.assignedCount||0} / ${p.totalCoupons} ใบ${p.destroyedCount ? ` · ทำลายแล้ว ${p.destroyedCount} ใบ` : ''}</div>
      <div class="count-line">${p.voucherCount ? `<span class="chip chip-give">พิมพ์คูปองได้</span>` : `<span class="chip chip-type">ยังไม่มีเลขคูปอง</span>`}</div>
      <div style="margin-top:8px;"><button class="btn btn-sm btn-ghost" data-act="archive" data-id="${p.id}">${p.archived?'กู้คืน':'เก็บถาวร'}</button></div>
    </div>`;
  };

  return `
    <div class="filters">
      <input type="text" placeholder="ค้นหาสาขา / รหัส / จังหวัด..." value="${escapeHtml(f.search)}" data-act="homeSearch">
      <select data-act="homeType"><option value="">ทุกประเภทงาน</option>${types.map(t=>`<option value="${escapeHtml(t)}" ${f.type===t?'selected':''}>${escapeHtml(t)}</option>`).join('')}</select>
      <select data-act="homeTeam"><option value="">ทุกทีม</option>${teams.map(t=>`<option value="${escapeHtml(t)}" ${f.team===t?'selected':''}>${escapeHtml(t)}</option>`).join('')}</select>
      <select data-act="homeStatus">
        <option value="all" ${f.status==='all'?'selected':''}>ทุกสถานะ</option>

      <button class="btn btn-sm btn-ghost" data-act="exportAllPlans">ส่งออก Excel ทั้งหมด</button>

/* ============ Render: plan detail ============ */
function renderPlan(){
  const plan = currentPlan(); const data = state.planData;
  const assignedCount = data.coupons.filter(c=>c.owner).length;
  const destroyedCount = data.coupons.filter(c=>c.destroyed).length;
  const remaining = plan.totalCoupons - assignedCount - destroyedCount;
  const byOwner = {}; data.coupons.forEach(c=>{ if(c.owner) (byOwner[c.owner]=byOwner[c.owner]||[]).push(c.no); });
  const owners = Object.keys(byOwner).sort();
  const status = planStatus(plan);

  const voucherCount = data.coupons.filter(c=>c.voucher).length;
  const gridCells = data.coupons.map(c=>{
    let cls='', style='', title='ยังไม่มีเจ้าของ';
    if(c.destroyed){ cls='destroyed'; title='ทำลายแล้ว'; }
    else if(c.owner){ cls='owned'; style=`background:${colorForKey(c.owner)};`; title=c.owner; }
    if(c.voucher) title += ' · '+c.voucher;
    return `<div class="coupon ${cls}" style="${style}" title="${escapeHtml(title)}">${c.no}</div>`;
  }).join('');
  const legend = owners.map(o=>`<div class="legend-chip"><span class="legend-swatch" style="background:${colorForKey(o)}"></span>${escapeHtml(o)}</div>`).join('')
    + (destroyedCount ? `<div class="legend-chip"><span class="legend-swatch destroyed-swatch"></span>ทำลายแล้ว</div>` : '');
  const summaryRows = owners.length ? owners.map(o=>{
    const ranges = compressRanges(byOwner[o]).map(rangeLabel).join(' , ');
    return `<tr><td><span class="owner-swatch" style="background:${colorForKey(o)}"></span>${escapeHtml(o)}</td><td>${byOwner[o].length}</td><td>${ranges}</td></tr>`;
  }).join('') : `<tr><td colspan="3" class="empty-row">ยังไม่มีใครเบิกคูปอง</td></tr>`;

  const filteredTx = [...data.transactions]
    .filter(t => !state.historyFilterName || ((t.newOwner||'')+'|'+(t.previousOwner||'')).toLowerCase().includes(state.historyFilterName.toLowerCase()))
    .filter(t => !state.historyFilterDate || new Date(t.timestamp).toISOString().slice(0,10) === state.historyFilterDate)
    .sort((a,b)=>b.timestamp-a.timestamp);
  const actionStyle = {'พิมพ์':'color:var(--ink);font-weight:800;', 'ใส่เลขคูปอง':'color:var(--brand-blue);font-weight:800;', 'เบิก':'color:var(--act-claim);font-weight:800;', 'โอน':'color:var(--act-transfer);font-weight:800;', 'ขยาย':'color:var(--act-extend);font-weight:800;', 'คืน':'color:var(--act-return);font-weight:800;', 'ทำลาย':'color:var(--act-destroy);font-weight:800;'};
  const historyRows = filteredTx.length ? filteredTx.map((t)=>`
    <tr>
      <td style="white-space:nowrap;">${fmtDate(t.timestamp)}</td>
      <td><span style="${actionStyle[t.actionType]||''}">${escapeHtml(t.actionType)}</span></td>
      <td>${txRangeLabel(t)}</td>
      <td>${t.previousOwner ? escapeHtml(t.previousOwner) : '<span style="color:var(--ink-faint)">—</span>'}</td>
      <td>${t.newOwner ? escapeHtml(t.newOwner) : '<span style="color:var(--ink-faint)">—</span>'}</td>
      <td>${t.count && t.actionType==='พิมพ์' ? `${t.count} ใบ ` : ''}${escapeHtml(t.note||'')} ${t.photo ? `<button type="button" class="link-btn" data-act="viewPhoto" data-photo-idx="${data.transactions.indexOf(t)}">ดูรูป</button>` : ''}</td>
    </tr>`).join('') : `<tr><td colspan="6" class="empty-row">ไม่พบรายการ</td></tr>`;

  let destroyBtn;
  if(remaining<=0){ destroyBtn = `<button class="btn btn-ghost" disabled>✓ ไม่มีคูปองเหลือ</button>`; }
  else if(!canDestroyToday(plan)){ destroyBtn = `<button class="btn btn-ghost" disabled title="ทำลายได้เฉพาะวันสุดท้ายของงาน">ทำลายคูปอง (รอวันสุดท้าย ${fmtDateShort(plan.endDate)})</button>`; }
  else { destroyBtn = `<button class="btn btn-destroy" data-act="destroyCoupons">ทำลายคูปองที่เหลือทั้งหมด (${remaining} ใบ)</button>`; }

  return `
    <div class="plan-head">
      <div><h2>${escapeHtml(plan.name)}</h2><div class="meta">${escapeHtml(plan.branchCode||'-')} · ${escapeHtml(plan.province||'-')} · ${fmtDateShort(plan.startDate)} – ${fmtDateShort(plan.endDate)}</div></div>
      <div class="toolbar">
        <button class="btn btn-claim" data-act="claim" ${!plan.team?'disabled':''}>เบิกคูปอง</button>
        <button class="btn btn-print" data-act="printCoupons" ${!voucherCount?'disabled title="ยังไม่มีเลขคูปองจริง รอแอดมินอัปโหลดไฟล์จาก nest"':''}>พิมพ์คูปอง</button>
        <button class="btn btn-transfer" data-act="transfer" ${!plan.team?'disabled':''}>โอน / สลับ</button>
        <button class="btn btn-return" data-act="returnCoupons" ${!plan.team?'disabled':''}>คืนคูปอง</button>
        <button class="btn btn-extend" data-act="extend">ขอคูปองเพิ่ม</button>
        <button class="btn btn-ghost" data-act="editPlan">แก้ไขแผนงาน</button>
        ${destroyBtn}
      </div>
    </div>

    ${remaining<=0 && (assignedCount+destroyedCount)>0 ? `<div class="closed-banner">✓ ปิดงานสมบูรณ์ — ไม่มีคูปองเหลือค้างในระบบ</div>` : ''}

    ${plan.team && !state.editingTeam ? `<div class="team-banner assigned">ทีมที่รับผิดชอบ: <strong>${escapeHtml(plan.team)}</strong> <button class="link-btn" data-act="editTeam">เปลี่ยนทีม</button></div>` : ''}
    ${(!plan.team || state.editingTeam) ? `
      ${!plan.team ? `<div class="team-banner unassigned">ยังไม่ได้กำหนดทีมที่รับผิดชอบแผนงานนี้ — เลือกทีมก่อนจึงจะเบิก/โอน/คืนคูปองได้</div>` : ''}
      <div class="team-editor">
        ${!state.teamManual ? `
          <select id="f-assign-team"><option value="">— เลือกทีม —</option>${teamsList().map(t=>`<option value="${escapeHtml(t)}" ${plan.team===t?'selected':''}>${escapeHtml(t)}</option>`).join('')}</select>
        ` : `
          <input type="text" id="f-assign-team-manual" placeholder="พิมพ์ชื่อทีม เช่น SMA14" value="${escapeHtml(plan.team||'')}">
        `}
        <button class="btn btn-sm btn-claim" data-act="submitAssignTeam">ยืนยัน</button>
        ${plan.team ? `<button class="btn btn-sm btn-ghost" data-act="cancelEditTeam">ยกเลิก</button>` : ''}
        <button type="button" class="link-btn" data-act="teamManual">${!state.teamManual ? 'ไม่พบทีมในรายชื่อ พิมพ์เอง' : 'เลือกจากรายชื่อทีมแทน'}</button>
      </div>` : ''}

    <div class="plan-chips">
      <span class="chip chip-type">${escapeHtml(plan.taskType)}</span>
      <span class="chip chip-status-${status}">${STATUS_LABEL[status]}</span>
      ${plan.needsBurmese ? '<span class="chip chip-burmese">ต้องการสื่อพม่า</span>' : ''}
    </div>
    <div class="meta" style="margin-bottom:14px;">เบิกแล้ว ${assignedCount} / ${plan.totalCoupons} ใบ${destroyedCount ? ` · ทำลายแล้ว ${destroyedCount} ใบ` : ''} · เหลือให้เบิก ${remaining} ใบ</div>
    ${renderVoucherPanel(plan, assignedCount, voucherCount)}

    <div class="tabs">
      <button class="tab ${state.planTab==='grid'?'active':''}" data-act="tab" data-tab="grid">สรุป &amp; กริดเบอร์</button>
      <button class="tab ${state.planTab==='history'?'active':''}" data-act="tab" data-tab="history">ประวัติธุรกรรม</button>
    </div>

    ${state.planTab==='grid' ? `
      <div class="panel">
        <div class="panel-title">กริดคูปอง (สีตามเจ้าของ)</div>
        <div class="coupon-grid">${gridCells}</div>
        <div class="coupon-legend">${legend || '<span style="color:var(--ink-faint)">ยังไม่มีเจ้าของ</span>'}</div>
      </div>
      <div class="panel">
        <div class="panel-title">สรุปคงเหลือ <button class="btn btn-sm btn-ghost" data-act="exportSummary">ส่งออก Excel</button></div>
        <div class="table-scroll"><table><thead><tr><th>เจ้าของ</th><th>จำนวน</th><th>ช่วงเบอร์</th></tr></thead><tbody>${summaryRows}</tbody></table></div>
      </div>
    ` : `
      <div class="panel">
        <div class="panel-title">ประวัติธุรกรรม <button class="btn btn-sm btn-ghost" data-act="exportHistory">ส่งออก Excel</button></div>
        <div class="filters">
          <input type="text" placeholder="ค้นหาชื่อ..." value="${escapeHtml(state.historyFilterName)}" data-act="filterName">
          <input type="date" value="${state.historyFilterDate}" data-act="filterDate">
        </div>
        <div class="table-scroll"><table><thead><tr><th>เวลา</th><th>ประเภท</th><th>ช่วงเบอร์</th><th>เจ้าของเดิม</th><th>เจ้าของใหม่ / ผู้ดำเนินการ</th><th>หมายเหตุ</th></tr></thead><tbody>${historyRows}</tbody></table></div>
      </div>
    `}
  `;
}

/* ============ Render: printable-coupon panel ============ */
function renderVoucherPanel(plan, assignedCount, voucherCount){
  const spec = couponSpec(plan);
  const lastPrint = state.planData.transactions.filter(t=>t.actionType==='พิมพ์').sort((a,b)=>b.timestamp-a.timestamp)[0];
  return `
    <div class="panel voucher-panel">
      ${voucherCount ? `<canvas class="ticket-preview" data-plan-thumb="1" aria-label="ตัวอย่างคูปองของแผนงานนี้"></canvas>` : `<div class="ticket-empty">ยังไม่มีเลขคูปองจริง<br>แอดมินอัปโหลดไฟล์จาก nest แล้วคูปองจะขึ้นตรงนี้</div>`}
      <div class="vp-body">
        <div>
          <h3 class="vp-title">คูปองเงินสด ${spec.value} บาท</h3>
          <div class="vp-sub">${voucherCount ? `มีเลขจริง ${voucherCount} / ${plan.totalCoupons} ใบ · ใช้ได้ ${escapeHtml(thRange(spec.from, spec.to))}${plan.voucherFile ? ` · ไฟล์ ${escapeHtml(plan.voucherFile)}` : ''}` : 'ยังพิมพ์ไม่ได้ จนกว่าจะใส่เลขคูปองจาก nest'}</div>
        </div>
        <div class="vp-stats">
          <div class="vp-stat claim"><b>${assignedCount}</b><span>เบิกแล้ว</span></div>
          <div class="vp-stat"><b>${voucherCount}</b><span>มีเลขพร้อมพิมพ์</span></div>
          ${lastPrint ? `<div class="vp-stat"><b style="font-size:15px;">${escapeHtml(fmtDate(lastPrint.timestamp))}</b><span>พิมพ์ล่าสุด ${lastPrint.count||''} ใบ</span></div>` : ''}
        </div>
        ${!state.schemaReady ? `<div class="schema-warn">ฐานข้อมูลยังไม่รองรับเลขคูปอง — ${COUPON_SQL_HINT}</div>` : ''}
        <div><button class="btn btn-sm btn-ghost" data-act="uploadVouchers">${voucherCount ? 'อัปโหลดเลขจาก nest ใหม่' : 'อัปโหลดเลขจาก nest (แอดมิน)'}</button></div>
      </div>
    </div>`;
}

/* ============ Render: employee picker (team locked to plan) ============ */
function renderEmployeePicker(prefix, manual, labelOverride){
  const plan = currentPlan();
  const emps = plan.team ? employeesByTeam(plan.team) : [];
  const label = labelOverride || 'ชื่อพนักงาน';
  return !manual ? `
    <div class="field">
      <label>${escapeHtml(label)} (ทีม ${escapeHtml(plan.team||'-')})</label>
      <select id="${prefix}-employee-select">
        <option value="">— เลือกพนักงาน —</option>
        ${emps.map(e=>{ const v=e.nickname+' / '+e.name; return `<option value="${escapeHtml(v)}" >${escapeHtml(e.nickname)} — ${escapeHtml(e.name)}</option>`; }).join('')}
      </select>
      <button type="button" class="link-btn" style="margin-top:6px;" data-act="${prefix}Manual">ไม่พบชื่อในรายชื่อ พิมพ์เอง</button>
    </div>` : `
    <div class="field">
      <label>${escapeHtml(label)} (กรอกเอง)</label>
      <input type="text" id="${prefix}-employee-manual" placeholder="พิมพ์ชื่อ">
      <button type="button" class="link-btn" style="margin-top:6px;" data-act="${prefix}Manual">เลือกจากรายชื่อทีมแทน</button>
    </div>`;
}
function getEmployeeValue(prefix, manual){
  if(manual){ const el=document.getElementById(prefix+'-employee-manual'); return el?el.value:''; }
  const el=document.getElementById(prefix+'-employee-select'); return el?el.value:'';
}

/* ============ Render: modals ============ */
function renderModal(){
  if(!state.modal) return '';
  const plan = state.currentPlanId ? currentPlan() : null;

  if(state.modal==='newPlan'){
    const typeOpts = state.couponTypes.map(t=>`<option value="${escapeHtml(t.name)}">${escapeHtml(t.name)} (${t.count} ใบ)</option>`).join('');
    const branchOptsHtml = branchesList().map(b=>`<option value="${escapeHtml(b.name)}"></option>`).join('');
    return `
    <div class="overlay" data-act="overlay"><div class="modal wide" data-act="stop">
      <h3>สร้างแผนงานใหม่</h3>
      <div class="modal-tabs">
        <button class="modal-tab ${state.modalTab==='single'?'active':''}" data-act="modalTab" data-tab="single">เพิ่มทีละรายการ</button>
        <button class="modal-tab ${state.modalTab==='import'?'active':''}" data-act="modalTab" data-tab="import">นำเข้าจาก Excel</button>
      </div>
      ${state.modalTab==='single' ? `
        <div class="field"><label>ชื่อสาขา / แผนงาน</label><input type="text" id="f-name" list="branch-options" data-act="branchName" placeholder="พิมพ์เพื่อค้นหา หรือใส่ชื่อใหม่" autofocus><datalist id="branch-options">${branchOptsHtml}</datalist></div>
        <div class="field-row">
          <div class="field"><label>รหัสสาขา (ถ้ามี)</label><input type="text" id="f-branchcode" placeholder="CJX00126"></div>
          <div class="field"><label>จังหวัด (ถ้ามี)</label><input type="text" id="f-province" placeholder="นนทบุรี"></div>
        </div>
        <div class="field"><label>ทีมที่รับผิดชอบ (ถ้าทราบแล้ว)</label>
          <select id="f-team"><option value="">— ยังไม่กำหนด —</option>${teamsList().map(t=>`<option value="${escapeHtml(t)}">${escapeHtml(t)}</option>`).join('')}</select>
        </div>
        <div class="field"><label>ประเภทงาน</label>
          <select id="f-tasktype" data-act="typeSelectChange">${typeOpts}<option value="__custom__">อื่นๆ (กำหนดเอง)</option></select>
        </div>
        <div id="f-type-locked" class="field"><label>จำนวนคูปอง (ล็อคตามประเภทงาน)</label><div class="locked-total">${state.couponTypes[0] ? state.couponTypes[0].count+' ใบ' : '-'}</div></div>
        <div id="f-type-custom" class="field-row" style="display:none;">
          <div class="field"><label>ชื่อประเภทงานใหม่</label><input type="text" id="f-custom-name" placeholder="เช่น กิจกรรมพิเศษ"></div>
          <div class="field"><label>จำนวนคูปอง</label><input type="number" id="f-custom-count" min="1" placeholder="เช่น 30"></div>
        </div>
        <div class="field-row">
          <div class="field"><label>วันที่เริ่ม (ถ้ามี)</label><input type="date" id="f-startdate"></div>
          <div class="field"><label>วันที่จบ (ถ้ามี)</label><input type="date" id="f-enddate"></div>
        </div>
        <div class="field-check"><input type="checkbox" id="f-burmese"><label for="f-burmese" style="margin:0; text-transform:none; font-size:13px;">ต้องการสื่อพม่า</label></div>
        ${state.modalError ? `<div class="modal-error">${escapeHtml(state.modalError)}</div>` : ''}
        <div class="modal-actions"><button class="btn btn-ghost" data-act="closeModal">ยกเลิก</button><button class="btn btn-claim" data-act="submitNewPlanSingle">สร้าง</button></div>
      ` : `
        <div class="file-drop">อัปโหลดไฟล์ Excel แผนงาน (ต้องมีชีท "แผนงาน" และ "จำนวนคูปอง" — ถ้ามีคอลัมน์ "ทีม" ระบบจะกำหนดทีมให้อัตโนมัติ) หรือไฟล์ตารางงานรายวัน (.csv คอลัมน์ ประเภท/รหัสสาขา/ชื่อสาขา/ประเภทแฟร์/ทีม/วันที่ — ระบบจะจับวันที่เริ่ม-จบจาก "วันจัดงาน" เท่านั้น)<br><input type="file" id="f-import-plans" accept=".xlsx,.xls,.csv"></div>
        <div class="modal-note">ระบบจะข้ามแผนงานที่มีรหัสสาขา + วันที่เริ่ม + ประเภทงานตรงกับที่มีอยู่แล้วอัตโนมัติ</div>
        ${state.modalError ? `<div class="modal-error">${escapeHtml(state.modalError)}</div>` : ''}
        <div class="modal-actions"><button class="btn btn-ghost" data-act="closeModal">ปิด</button></div>
      `}
    </div></div>`;
  }

  if(state.modal==='claim'){
    return `
    <div class="overlay" data-act="overlay"><div class="modal" data-act="stop">
      <h3>เบิกคูปอง</h3>
      ${renderEmployeePicker('claim', state.claimManual)}
      <div class="field"><label>จำนวนที่จะเบิก (ใบ)</label><input type="number" id="f-count" min="1" placeholder="เช่น 20"></div>
      <div class="modal-note">ระบบจะมอบเบอร์ถัดจากคนล่าสุดให้อัตโนมัติ</div>
      ${state.modalError ? `<div class="modal-error">${escapeHtml(state.modalError)}</div>` : ''}
      <div class="modal-actions"><button class="btn btn-ghost" data-act="closeModal">ยกเลิก</button><button class="btn btn-claim" data-act="submitClaim">เบิก</button></div>
    </div></div>`;
  }

  if(state.modal==='transfer'){
    const blocks = ownerBlocks();
    return `
    <div class="overlay" data-act="overlay"><div class="modal" data-act="stop">
      <h3>โอน / สลับคูปอง</h3>
      <div class="field"><label>เลือกจากรายการที่เบิกแล้ว</label>
        <select id="f-block-select" data-act="transferBlockChange">
          <option value="">— เลือกช่วงที่จะโอน —</option>
          ${blocks.map(b=>`<option value="${b.from}|${b.to}">${escapeHtml(b.owner)}: #${b.from}–${b.to} (${b.to-b.from+1} ใบ)</option>`).join('')}
        </select>
      </div>
      <div class="field-row">
        <div class="field"><label>จากเบอร์</label><input type="number" id="f-from" min="1"></div>
        <div class="field"><label>ถึงเบอร์</label><input type="number" id="f-to" min="1"></div>
      </div>
      ${renderEmployeePicker('transfer', state.transferManual)}
      <div class="modal-note">เลือกช่วงจากรายการเบิกแล้วเท่านั้น (ปรับช่วงย่อยได้)</div>
      ${state.modalError ? `<div class="modal-error">${escapeHtml(state.modalError)}</div>` : ''}
      <div class="modal-actions"><button class="btn btn-ghost" data-act="closeModal">ยกเลิก</button><button class="btn btn-transfer" data-act="submitTransfer">โอน</button></div>
    </div></div>`;
  }

  if(state.modal==='returnCoupons'){
    const blocks = ownerBlocks();
    return `
    <div class="overlay" data-act="overlay"><div class="modal" data-act="stop">
      <h3>คืนคูปอง</h3>
      <div class="field"><label>เลือกจากรายการที่เบิกแล้ว</label>
        <select id="f-return-block-select" data-act="returnBlockChange">
          <option value="">— เลือกช่วงที่จะคืน —</option>
          ${blocks.map(b=>`<option value="${b.from}|${b.to}">${escapeHtml(b.owner)}: #${b.from}–${b.to} (${b.to-b.from+1} ใบ)</option>`).join('')}
        </select>
      </div>
      <div class="field-row">
        <div class="field"><label>จากเบอร์</label><input type="number" id="f-return-from" min="1"></div>
        <div class="field"><label>ถึงเบอร์</label><input type="number" id="f-return-to" min="1"></div>
      </div>
      <div class="modal-note">คืนได้เฉพาะช่วงของเจ้าของคนเดียวกันเท่านั้น เบอร์ที่คืนจะกลับเป็น "ยังไม่มีเจ้าของ"</div>
      ${state.modalError ? `<div class="modal-error">${escapeHtml(state.modalError)}</div>` : ''}
      <div class="modal-actions"><button class="btn btn-ghost" data-act="closeModal">ยกเลิก</button><button class="btn btn-return" data-act="submitReturn">คืนคูปอง</button></div>
    </div></div>`;
  }

  if(state.modal==='extend'){
    return `
    <div class="overlay" data-act="overlay"><div class="modal" data-act="stop">
      <h3>ขอคูปองเพิ่ม</h3>
      <div class="modal-note">แผนงาน "${escapeHtml(plan.name)}" มีทั้งหมด ${plan.totalCoupons} ใบ (เหลือให้เบิก ${plan.totalCoupons - state.planData.coupons.filter(c=>c.owner||c.destroyed).length} ใบ)</div>
      <div class="field" style="margin-top:12px;"><label>จำนวนที่ขอเพิ่ม (ใบ)</label><input type="number" id="f-extend-amount" min="1" placeholder="เช่น 50" autofocus></div>
      <div class="field"><label>หมายเหตุ (ถ้ามี)</label><input type="text" id="f-extend-note" placeholder="เช่น อนุมัติเพิ่มจากหัวหน้างาน"></div>
      ${state.modalError ? `<div class="modal-error">${escapeHtml(state.modalError)}</div>` : ''}
      <div class="modal-actions"><button class="btn btn-ghost" data-act="closeModal">ยกเลิก</button><button class="btn btn-extend" data-act="submitExtend">ขอเพิ่ม</button></div>
    </div></div>`;
  }

  if(state.modal==='editPlan'){
    const usedNos = state.planData.coupons.filter(c=>c.owner||c.destroyed).map(c=>c.no);
    const maxUsed = usedNos.length ? Math.max(...usedNos) : 0;
    // Only one <option> may carry `selected` — if both the "__custom__" option and a matching
    // preset option were marked selected (e.g. right after saving a custom type that happens
    // to match one already in the list), the browser silently honors whichever is later in the
    // DOM, discarding state.editPlanTypeCustom. Gate the preset match on !editPlanTypeCustom.
    const typeOptsEdit = state.couponTypes.map(t=>`<option value="${escapeHtml(t.name)}" ${(!state.editPlanTypeCustom && plan.taskType===t.name)?'selected':''}>${escapeHtml(t.name)} (${t.count} ใบ)</option>`).join('');
    const matchedType = state.couponTypes.find(t=>t.name===plan.taskType);
    const branchOptsEditHtml = branchesList().map(b=>`<option value="${escapeHtml(b.name)}"></option>`).join('');
    return `
    <div class="overlay" data-act="overlay"><div class="modal wide" data-act="stop">
      <h3>แก้ไขแผนงาน</h3>
      <div class="field"><label>ชื่อสาขา / แผนงาน</label><input type="text" id="f-edit-name" list="branch-options-edit" data-act="branchNameEdit" value="${escapeHtml(plan.name)}" autofocus><datalist id="branch-options-edit">${branchOptsEditHtml}</datalist></div>
      <div class="field-row">
        <div class="field"><label>รหัสสาขา (ถ้ามี)</label><input type="text" id="f-edit-branchcode" value="${escapeHtml(plan.branchCode||'')}"></div>
        <div class="field"><label>จังหวัด (ถ้ามี)</label><input type="text" id="f-edit-province" value="${escapeHtml(plan.province||'')}"></div>
      </div>
      <div class="field">
        <label>ประเภทงาน</label>
        <select id="f-edit-tasktype">
          <option value="__custom__" ${state.editPlanTypeCustom?'selected':''}>— กำหนดเอง / ไม่อยู่ในรายการ —</option>
          ${typeOptsEdit}
        </select>
      </div>
      <div id="f-edit-type-locked" class="field" style="display:${state.editPlanTypeCustom?'none':''};"><label>จำนวนคูปอง (ล็อคตามประเภทงาน)</label><div class="locked-total">${matchedType ? matchedType.count+' ใบ' : (plan.totalCoupons+' ใบ (เดิม)')}</div></div>
      <div id="f-edit-type-custom" class="field-row" style="display:${state.editPlanTypeCustom?'flex':'none'};">
        <div class="field"><label>ชื่อประเภทงาน</label><input type="text" id="f-edit-custom-name" value="${escapeHtml(plan.taskType||'')}"></div>
        <div class="field"><label>จำนวนคูปองทั้งหมด</label><input type="number" id="f-edit-custom-count" min="0" value="${plan.totalCoupons}"></div>
      </div>
      ${maxUsed>0 ? `<div class="modal-note">เบิก/ทำลายไปแล้วถึงเบอร์ ${maxUsed} — ลดจำนวนคูปองต่ำกว่านี้ไม่ได้</div>` : ''}
      <div class="field-row">
        <div class="field"><label>วันที่เริ่ม</label><input type="date" id="f-edit-startdate" value="${plan.startDate||''}"></div>
        <div class="field"><label>วันที่จบ</label><input type="date" id="f-edit-enddate" value="${plan.endDate||''}"></div>
      </div>
      <div class="field-check"><input type="checkbox" id="f-edit-burmese" ${plan.needsBurmese?'checked':''}><label for="f-edit-burmese" style="margin:0; text-transform:none; font-size:13px;">ต้องการสื่อพม่า</label></div>
      ${state.modalError ? `<div class="modal-error">${escapeHtml(state.modalError)}</div>` : ''}
      <div class="modal-actions">
        <button class="btn btn-destroy" data-act="deletePlan" style="margin-right:auto;">ลบแผนงานนี้</button>
        <button class="btn btn-ghost" data-act="closeModal">ยกเลิก</button>
        <button class="btn btn-claim" data-act="submitEditPlan">บันทึก</button>
      </div>
    </div></div>`;
  }

  if(state.modal==='destroyCoupons'){
    const blocks = unclaimedBlocks();
    const total = blocks.reduce((s,b)=>s+(b.to-b.from+1),0);
    return `
    <div class="overlay" data-act="overlay"><div class="modal" data-act="stop">
      <h3>ทำลายคูปองที่เหลือทั้งหมด</h3>
      <div class="modal-warning">การทำลายจะรวมคูปองที่เหลือ "ทุกช่วง" มาทำลายในครั้งเดียว รวม ${total} ใบ — ทำแล้วแก้ไขไม่ได้</div>
      <div class="destroy-block-list">${blocks.map(b=>`<div>${rangeLabel([b.from,b.to])} (${b.to-b.from+1} ใบ)</div>`).join('')}</div>
      ${renderEmployeePicker('destroy', state.destroyManual, 'ผู้ทำลาย')}
      <div class="field"><label>แนบรูปตอนทำลาย (จำเป็น)</label>
        <input type="file" id="f-destroy-photo" accept="image/*" capture="environment">
        ${state.destroyPhoto ? `<img class="photo-preview" src="${state.destroyPhoto}">` : ''}
      </div>
      <div class="field"><label>หมายเหตุ (ถ้ามี)</label><input type="text" id="f-destroy-note" placeholder="เช่น เหลือจากงานแฟร์ ทำลายต่อหน้าหัวหน้างาน"></div>
      ${state.modalError ? `<div class="modal-error">${escapeHtml(state.modalError)}</div>` : ''}
      <div class="modal-actions"><button class="btn btn-ghost" data-act="closeModal">ยกเลิก</button><button class="btn btn-destroy" data-act="submitDestroy">ยืนยันทำลายทั้งหมด</button></div>
    </div></div>`;
  }

  if(state.modal==='uploadVouchers'){
    const imp = state.voucherImport;
    const existing = state.planData.coupons.filter(c=>c.voucher).length;
    const mark = {y:'✓', w:'!', n:'✕'};
    return `
    <div class="overlay" data-act="overlay"><div class="modal wide" data-act="stop">
      <h3>ใส่เลขคูปองจาก nest</h3>
      <div class="modal-note">แผนงาน "${escapeHtml(plan.name)}" (${escapeHtml(plan.branchCode||'-')}) · เลือกไฟล์ VC…xlsx ที่ export จาก nest ของสาขานี้ เบอร์ #1, #2 … ในสมุดจะผูกกับ Running No. ในไฟล์</div>
      ${existing ? `<div class="modal-warning" style="margin-top:10px;">แผนงานนี้มีเลขคูปองอยู่แล้ว ${existing} ใบ อัปโหลดใหม่จะแทนที่เลขเดิมทั้งหมด</div>` : ''}
      <div class="file-drop" style="margin-top:12px;">ไฟล์เลขคูปองจาก nest (.xlsx)<br><input type="file" id="f-voucher-file" accept=".xlsx,.xls,.csv"></div>
      ${imp && imp.status==='reading' ? `<div class="print-status">กำลังอ่านไฟล์ ${escapeHtml(imp.fileName)}…</div>` : ''}
      ${imp && imp.status!=='reading' ? `
        <div class="import-summary" style="margin-top:12px;">
          <div><b>${imp.items.length} ใบ</b>${escapeHtml(imp.fileName)}</div>
          <div><b>${imp.value} บาท</b>มูลค่าต่อใบ</div>
          <div><b>${escapeHtml(thRange(cpDate(imp.validFrom), cpDate(imp.validTo))||'-')}</b>วันที่ใช้ได้</div>
          <div><b>${escapeHtml(imp.stores.join(', ')||'-')}</b>รหัสสาขาในไฟล์</div>
        </div>
        <div class="check-list">${imp.checks.map(c=>`<div><span class="${c.s}">${mark[c.s]}</span><span>${escapeHtml(c.t)}</span></div>`).join('')}</div>` : ''}
      ${!state.schemaReady ? `<div class="schema-warn" style="margin-top:10px;">${COUPON_SQL_HINT}</div>` : ''}
      ${state.modalError ? `<div class="modal-error">${escapeHtml(state.modalError)}</div>` : ''}
      <div class="modal-actions"><button class="btn btn-ghost" data-act="closeModal">ยกเลิก</button><button class="btn btn-claim" data-act="submitVouchers" ${!imp || imp.status!=='ready' || imp.checks.some(c=>c.s==='n') ? 'disabled' : ''}>${imp && imp.status==='saving' ? 'กำลังบันทึก…' : 'บันทึกเลขคูปอง'}</button></div>
    </div></div>`;
  }

  if(state.modal==='printCoupons'){
    const o = state.printOpts;
    const avail = state.planData.coupons.filter(c=>c.voucher && !c.destroyed).length;
    const count = o.scope==='range' ? printableItems('range', parseInt(o.from,10)||0, parseInt(o.to,10)||0).length : avail;
    const sheets = Math.ceil(count/10);
    return `
    <div class="overlay" data-act="overlay"><div class="modal wide" data-act="stop">
      <h3>พิมพ์คูปอง ${escapeHtml(plan.name)}</h3>
      <canvas class="ticket-preview" data-print-preview="1" aria-label="ตัวอย่างคูปอง" style="width:100%;height:auto;display:block;border-radius:6px;margin-bottom:12px;"></canvas>
      <div class="field"><label>พิมพ์ชุดไหน</label>
        <div class="seg-row">
          <button type="button" class="seg-opt" data-act="printScope" data-scope="all" aria-pressed="${o.scope==='all'}">ทั้งแผนงาน<small>${avail} ใบ (ไม่รวมที่ทำลายแล้ว)</small></button>
          <button type="button" class="seg-opt" data-act="printScope" data-scope="range" aria-pressed="${o.scope==='range'}">ระบุช่วงเบอร์<small>เช่น พิมพ์เพิ่มเฉพาะบางใบ</small></button>
        </div>
      </div>
      ${o.scope==='range' ? `<div class="field-row"><div class="field"><label>จากเบอร์</label><input type="number" id="f-print-from" min="1" value="${escapeHtml(o.from)}"></div><div class="field"><label>ถึงเบอร์</label><input type="number" id="f-print-to" min="1" value="${escapeHtml(o.to)}"></div></div>` : ''}
      <div class="modal-note" id="print-note">${count} ใบ · ${sheets} แผ่น A4 · ใบยาว 10 ใบต่อ 1 หน้า พิมพ์หน้าเดียว · สั่งพิมพ์ขนาด 100% (Actual size) ห้ามย่อให้พอดีหน้า · ก่อนให้ไฟล์ ระบบสแกนอ่านบาร์โค้ดทุกใบเทียบกับเลขจาก nest</div>
      <div class="print-status" id="print-status" role="status"></div>
      <div class="print-progress" hidden><i id="print-bar"></i></div>
      ${state.modalError ? `<div class="modal-error">${escapeHtml(state.modalError)}</div>` : ''}
      <div class="modal-actions"><button class="btn btn-ghost" data-act="closeModal">ยกเลิก</button><button class="btn btn-print" data-act="submitPrint" ${!count?'disabled':''}>สแกนตรวจ + ดาวน์โหลด PDF</button></div>
    </div></div>`;
  }

  if(state.modal==='settingsTypes'){
    return `
    <div class="overlay" data-act="overlay"><div class="modal" data-act="stop">
      <h3>ตั้งค่าประเภทงาน &amp; จำนวนคูปอง</h3>
      <div id="type-rows">
        ${state.typeEditRows.map((t,i)=>`
          <div class="type-row">
            <input type="text" value="${escapeHtml(t.name)}" data-typeidx="${i}" data-field="name" placeholder="ชื่อประเภทงาน">
            <input type="number" value="${t.count}" min="0" data-typeidx="${i}" data-field="count">
            <button type="button" class="btn btn-sm btn-ghost" data-act="removeTypeRow" data-idx="${i}">ลบ</button>
          </div>`).join('')}
      </div>
      <button type="button" class="link-btn" data-act="addTypeRow">+ เพิ่มประเภทงานใหม่</button>
      <div class="modal-note">การเปลี่ยนจำนวนที่นี่มีผลกับแผนงาน "ใหม่" เท่านั้น แผนงานเดิมใช้ปุ่ม "ขอคูปองเพิ่ม" แทน</div>
      ${state.modalError ? `<div class="modal-error">${escapeHtml(state.modalError)}</div>` : ''}
      <div class="modal-actions"><button class="btn btn-ghost" data-act="closeModal">ยกเลิก</button><button class="btn btn-claim" data-act="submitTypeSettings">บันทึก</button></div>
    </div></div>`;
  }

  if(state.modal==='importEmployees'){
    const sync = state.employeeSync;
    let syncStatusHtml;
    if(sync.status==='syncing'){
      syncStatusHtml = `<div class="team-banner assigned">กำลังซิงค์จาก Google Sheet…</div>`;
    } else if(sync.status==='error'){
      syncStatusHtml = `<div class="team-banner unassigned">ซิงค์ล่าสุดไม่สำเร็จ: ${escapeHtml(sync.error||'')}${sync.lastSyncedAt ? ` (ใช้รายชื่อจากการซิงค์ครั้งก่อนเมื่อ ${fmtDate(sync.lastSyncedAt)})` : ''}</div>`;
    } else if(sync.lastSyncedAt){
      syncStatusHtml = `<div class="team-banner assigned">ซิงค์ล่าสุด: ${fmtDate(sync.lastSyncedAt)} (${sync.count} คน)</div>`;
    } else {
      syncStatusHtml = `<div class="team-banner unassigned">ยังไม่เคยซิงค์สำเร็จในเซสชันนี้</div>`;
    }
    const filter = (state.employeeListFilter||'').trim().toLowerCase();
    const matches = e => !filter || [e.team,e.name,e.nickname,e.code,e.phone].some(v=>String(v||'').toLowerCase().includes(filter));
    const grouped = teamsList().map(t=>({team:t, emps: employeesByTeam(t).filter(matches)})).filter(g=>g.emps.length);
    const noTeam = state.employees.filter(e=>!e.team && matches(e));
    const rosterRows = [
      ...grouped.map(g=>`
        <tr class="roster-team-row"><td colspan="4">${escapeHtml(g.team)} (${g.emps.length} คน)</td></tr>
        ${g.emps.map(e=>`<tr><td>${escapeHtml(e.nickname||'-')}</td><td>${escapeHtml(e.name||'-')}</td><td>${escapeHtml(e.code||'-')}</td><td>${escapeHtml(e.phone||'-')}</td></tr>`).join('')}
      `),
      noTeam.length ? `
        <tr class="roster-team-row"><td colspan="4">ยังไม่มีทีม (${noTeam.length} คน)</td></tr>
        ${noTeam.map(e=>`<tr><td>${escapeHtml(e.nickname||'-')}</td><td>${escapeHtml(e.name||'-')}</td><td>${escapeHtml(e.code||'-')}</td><td>${escapeHtml(e.phone||'-')}</td></tr>`).join('')}
      ` : '',
    ].join('');
    return `
    <div class="overlay" data-act="overlay"><div class="modal wide" data-act="stop">
      <h3>รายชื่อพนักงาน</h3>
      <div class="modal-note">รายชื่อพนักงานซิงค์อัตโนมัติจาก <strong>Google Sheet "รายชื่อพนักงานทีมกิจ"</strong> ทุกครั้งที่เปิดหน้านี้ — แก้ไขรายชื่อ/ทีมในชีตแล้วรีเฟรชหน้าเว็บ ระบบจะดึงมาใหม่ให้เอง</div>
      ${syncStatusHtml}
      <div class="modal-actions" style="margin-bottom:16px;"><button class="btn btn-sm btn-claim" data-act="syncEmployeesNow" ${sync.status==='syncing'?'disabled':''}>ซิงค์เดี๋ยวนี้</button></div>
      ${state.employees.length ? `
        <input type="text" placeholder="ค้นหาชื่อ/ทีม/รหัส/เบอร์โทร..." value="${escapeHtml(state.employeeListFilter||'')}" data-act="filterEmployeeList" style="width:100%; margin-bottom:10px; border:2px solid var(--ink); padding:8px 10px; border-radius:var(--radius-sm); background:var(--paper); font-size:13px;">
        <div class="table-scroll" style="max-height:340px; overflow-y:auto;">
          <table><thead><tr><th>ชื่อเล่น</th><th>ชื่อ-สกุล</th><th>รหัสพนักงาน</th><th>เบอร์โทร</th></tr></thead>
          <tbody>${rosterRows || `<tr><td colspan="4" class="empty-row">ไม่พบพนักงานที่ตรงกับคำค้นหา</td></tr>`}</tbody></table>
        </div>
      ` : `<div class="modal-note">ยังไม่มีรายชื่อพนักงานในระบบ — รอซิงค์จาก Google Sheet หรืออัปโหลดไฟล์ด้านล่าง</div>`}
      <div class="file-drop" style="margin-top:14px;">หรืออัปโหลดไฟล์ Excel แทน (สำรอง กรณี Google Sheet เข้าไม่ได้) — คอลัมน์: ทีม, Area, รหัสพนักงาน, ชื่อพนักงาน, ชื่อเล่น, เพศ<br><input type="file" id="f-import-employees" accept=".xlsx,.xls"></div>
      <div class="modal-note">ไม่ว่าจะซิงค์จาก Google Sheet หรืออัปโหลดไฟล์ ระบบจะ "แทนที่" รายชื่อพนักงานทั้งหมดที่มีอยู่ในระบบ</div>
      ${state.modalError ? `<div class="modal-error">${escapeHtml(state.modalError)}</div>` : ''}
      <div class="modal-actions"><button class="btn btn-ghost" data-act="closeModal">ปิด</button></div>
    </div></div>`;
  }
  return '';
}

/* ============ Event wiring ============ */
function attachHandlers(){
  const app = document.getElementById('app');
  app.onclick = (e) => {
    const el = e.target.closest('[data-act]'); if(!el) return;
    const act = el.dataset.act;
    if(act==='overlay'){ closeModal(); return; }
    if(act==='closePhoto'){ state.viewPhotoUrl=null; render(); return; }
    if(act==='stop'){ e.stopPropagation(); return; }
    if(act==='home'){ goHome(); return; }
    if(act==='goHelp'){ goHelp(); return; }
    if(act==='reopenPlan'){ if(state.currentPlanId) openPlan(state.currentPlanId); return; }
    if(act==='open'){ openPlan(el.dataset.id); return; }
    if(act==='archive'){ e.stopPropagation(); toggleArchive(el.dataset.id); return; }
    if(act==='newPlan'){ openModal('newPlan'); return; }
    if(act==='closeModal'){ closeModal(); return; }
    if(act==='claim'){ if(el.disabled) return; state.claimManual=false; openModal('claim'); return; }
    if(act==='transfer'){ if(el.disabled) return; state.transferManual=false; openModal('transfer'); return; }
    if(act==='returnCoupons'){ if(el.disabled) return; openModal('returnCoupons'); return; }
    if(act==='destroyCoupons'){ if(el.disabled) return; state.destroyManual=false; openModal('destroyCoupons'); return; }
    if(act==='extend'){ openModal('extend'); return; }
    if(act==='editPlan'){ openModal('editPlan'); return; }
    if(act==='deletePlan'){ deletePlanConfirm(); return; }
    if(act==='settingsTypes'){ openModal('settingsTypes'); return; }
    if(act==='importEmployees'){ openModal('importEmployees'); return; }
    if(act==='syncEmployeesNow'){ syncEmployeesFromSheet({silent:false}); return; }
    if(act==='cleanupOldPlans'){ cleanupOldPlans(); return; }
    if(act==='resetPlans'){ resetAllPlans(); return; }
    if(act==='editTeam'){ state.editingTeam=true; state.teamManual=false; render(); return; }
    if(act==='cancelEditTeam'){ state.editingTeam=false; state.teamManual=false; render(); return; }
    if(act==='teamManual'){ state.teamManual = !state.teamManual; render(); return; }
    if(act==='submitAssignTeam'){
      const el = state.teamManual ? document.getElementById('f-assign-team-manual') : document.getElementById('f-assign-team');
      assignTeam(el ? el.value : '');
      return;
    }
    if(act==='tab'){ state.planTab = el.dataset.tab; render(); return; }
    if(act==='modalTab'){ state.modalTab = el.dataset.tab; state.modalError=''; render(); return; }
    if(act==='exportHistory'){ exportHistoryXlsx(); return; }
    if(act==='exportSummary'){ exportSummaryXlsx(); return; }
    if(act==='exportAllPlans'){ exportAllPlansXlsx(); return; }
    if(act==='viewPhoto'){ const t = state.planData.transactions[parseInt(el.dataset.photoIdx,10)]; if(t && t.photo){ state.viewPhotoUrl = t.photo; render(); } return; }
    if(act==='claimManual'){ state.claimManual = !state.claimManual; render(); return; }
    if(act==='transferManual'){ state.transferManual = !state.transferManual; render(); return; }
    if(act==='destroyManual'){ state.destroyManual = !state.destroyManual; render(); return; }
    if(act==='addTypeRow'){ state.typeEditRows.push({name:'', count:0}); render(); return; }
    if(act==='removeTypeRow'){ state.typeEditRows.splice(parseInt(el.dataset.idx,10),1); render(); return; }
    if(act==='submitTypeSettings'){ saveTypeSettings(); return; }
    if(act==='submitNewPlanSingle'){
      const typeSel = document.getElementById('f-tasktype').value;
      createPlanSingle({
        name: document.getElementById('f-name').value, branchCode: document.getElementById('f-branchcode').value,
        province: document.getElementById('f-province').value, team: document.getElementById('f-team').value,
        typeMode: typeSel==='__custom__' ? 'custom' : 'preset', typeName: typeSel,
        customName: document.getElementById('f-custom-name') ? document.getElementById('f-custom-name').value : '',
        customCount: document.getElementById('f-custom-count') ? document.getElementById('f-custom-count').value : '',
        startDate: document.getElementById('f-startdate').value, endDate: document.getElementById('f-enddate').value,
        needsBurmese: document.getElementById('f-burmese').checked,
      });
      return;
    }
    if(act==='submitClaim'){ claimCoupons(getEmployeeValue('claim', state.claimManual), document.getElementById('f-count').value); return; }
    if(act==='submitTransfer'){ transferCoupons(document.getElementById('f-from').value, document.getElementById('f-to').value, getEmployeeValue('transfer', state.transferManual)); return; }
    if(act==='submitReturn'){ returnCoupons(document.getElementById('f-return-from').value, document.getElementById('f-return-to').value); return; }
    if(act==='submitExtend'){ extendCoupons(document.getElementById('f-extend-amount').value, document.getElementById('f-extend-note').value); return; }
    if(act==='submitEditPlan'){
      const typeSel = document.getElementById('f-edit-tasktype').value;
      saveEditPlan({
        name: document.getElementById('f-edit-name').value,
        branchCode: document.getElementById('f-edit-branchcode').value,
        province: document.getElementById('f-edit-province').value,
        typeMode: typeSel==='__custom__' ? 'custom' : 'preset', typeName: typeSel,
        customName: document.getElementById('f-edit-custom-name') ? document.getElementById('f-edit-custom-name').value : '',
        customCount: document.getElementById('f-edit-custom-count') ? document.getElementById('f-edit-custom-count').value : '',
        startDate: document.getElementById('f-edit-startdate').value,
        endDate: document.getElementById('f-edit-enddate').value,
        needsBurmese: document.getElementById('f-edit-burmese').checked,
      });
      return;
    }
    if(act==='uploadVouchers'){ state.voucherImport=null; openModal('uploadVouchers'); return; }
    if(act==='submitVouchers'){ if(!el.disabled) confirmVoucherImport(); return; }
    if(act==='printCoupons'){ if(el.disabled) return; state.printOpts={scope:'all', from:'', to:''}; openModal('printCoupons'); return; }
    if(act==='printScope'){ state.printOpts.scope=el.dataset.scope; render(); return; }
    if(act==='submitPrint'){ if(!el.disabled) printCoupons(); return; }
    if(act==='submitDestroy'){ destroyAllRemaining(getEmployeeValue('destroy', state.destroyManual), document.getElementById('f-destroy-note').value, state.destroyPhoto); return; }
  };
  app.onchange = (e) => {
    const el = e.target;
    if(el.id==='f-tasktype'){
      const isCustom = el.value==='__custom__';
      document.getElementById('f-type-locked').style.display = isCustom ? 'none' : '';
      document.getElementById('f-type-custom').style.display = isCustom ? 'flex' : 'none';
      if(!isCustom){ const t = state.couponTypes.find(t=>t.name===el.value); document.getElementById('f-type-locked').querySelector('.locked-total').textContent = t ? t.count+' ใบ' : '-'; }
      return;
    }
    if(el.id==='f-edit-tasktype'){
      const isCustom = el.value==='__custom__';
      state.editPlanTypeCustom = isCustom;
      document.getElementById('f-edit-type-locked').style.display = isCustom ? 'none' : '';
      document.getElementById('f-edit-type-custom').style.display = isCustom ? 'flex' : 'none';
      if(!isCustom){ const t = state.couponTypes.find(t=>t.name===el.value); document.getElementById('f-edit-type-locked').querySelector('.locked-total').textContent = t ? t.count+' ใบ' : '-'; }
      return;
    }
    if(el.id==='f-block-select' && el.value){ const [f,t]=el.value.split('|'); document.getElementById('f-from').value=f; document.getElementById('f-to').value=t; return; }
    if(el.id==='f-return-block-select' && el.value){ const [f,t]=el.value.split('|'); document.getElementById('f-return-from').value=f; document.getElementById('f-return-to').value=t; return; }
    if(el.dataset.typeidx !== undefined){ state.typeEditRows[parseInt(el.dataset.typeidx,10)][el.dataset.field] = el.value; return; }
    if(el.id==='f-import-plans' && el.files[0]){ handleImportPlansFile(el.files[0]); return; }
    if(el.id==='f-import-employees' && el.files[0]){ handleImportEmployeesFile(el.files[0]); return; }
    if(el.id==='f-voucher-file' && el.files[0]){ handleVoucherFile(el.files[0]); return; }
    if(el.id==='f-destroy-photo' && el.files[0]){ handleDestroyPhoto(el.files[0]); return; }
  };
  app.oninput = (e) => {
    // keep typed values across the re-renders that option buttons trigger in these modals
    const fieldMap = {'f-print-from':['printOpts','from'], 'f-print-to':['printOpts','to']};
    const fm = fieldMap[e.target.id];
    if(fm){ state[fm[0]][fm[1]]=e.target.value; const b=document.querySelector('[data-act="submitPrint"]'); const n=printableItems('range', parseInt(state.printOpts.from,10)||0, parseInt(state.printOpts.to,10)||0).length; if(b) b.disabled=!n; const nn=document.getElementById('print-note'); if(nn) nn.textContent=nn.textContent.replace(/^\d+ ใบ · \d+ แผ่น A4/, `${n} ใบ · ${Math.ceil(n/10)} แผ่น A4`); return; }
    const el = e.target.closest('[data-act]'); if(!el) return;
    if(el.dataset.act==='filterName'){ state.historyFilterName = el.value; render(); refocus('input[data-act="filterName"]'); }
    if(el.dataset.act==='filterDate'){ state.historyFilterDate = el.value; render(); }
    if(el.dataset.act==='homeSearch'){ state.homeFilter.search = el.value; render(); refocus('input[data-act="homeSearch"]'); }
    if(el.dataset.act==='filterEmployeeList'){ state.employeeListFilter = el.value; render(); refocus('input[data-act="filterEmployeeList"]'); }
    // Fires on every keystroke AND on picking a <datalist> suggestion (both are 'input'
    // events). No render() here — this modal's other fields (dates, province, ...) live only
    // in the DOM until submit, and a full re-render would wipe whatever the user already
    // typed into them; a matched branch just gets its code written directly into the sibling
    // input instead.
    if(el.dataset.act==='branchName' || el.dataset.act==='branchNameEdit'){
      const match = branchesList().find(b=>b.name===el.value);
      if(match){
        const codeInput = document.getElementById(el.dataset.act==='branchName' ? 'f-branchcode' : 'f-edit-branchcode');
        if(codeInput && match.code) codeInput.value = match.code;
      }
      return;
    }
  };
  app.onkeydown = (e) => { if(e.key==='Escape'){ if(state.viewPhotoUrl){ state.viewPhotoUrl=null; render(); } else if(state.modal){ closeModal(); } } };
  const typeSel = app.querySelector('select[data-act="homeType"]'); if(typeSel) typeSel.onchange = (e)=>{ state.homeFilter.type = e.target.value; render(); };
  const teamSel = app.querySelector('select[data-act="homeTeam"]'); if(teamSel) teamSel.onchange = (e)=>{ state.homeFilter.team = e.target.value; render(); };
  const statusSel = app.querySelector('select[data-act="homeStatus"]'); if(statusSel) statusSel.onchange = (e)=>{ state.homeFilter.status = e.target.value; render(); };
}
function refocus(sel){ const el=document.querySelector(sel); if(el){ const v=el.value; el.focus(); el.value=''; el.value=v; el.setSelectionRange(v.length,v.length); } }

init();
</script>
</body>
</html>
