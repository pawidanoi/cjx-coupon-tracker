<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>สมุดเบิกคูปอง CJX</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsbarcode/3.11.6/JsBarcode.all.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=Prompt:wght@500;600;700;800;900&family=Sarabun:wght@400;600&display=swap">
<style>
  :root{
    /* CJX-inspired palette: sunny yellow/orange, brand red + blue, warm brown "sticker" outline */
    --paper:#FBF6EA; --paper-dark:#F3E9D2; --panel:#FFFFFF;
    --ink:#3B2A18; --ink-soft:#7A6A52; --ink-faint:#B5A78C; --line:#E9DDC0; --dash:#D8C79E;
    --brand-yellow:#FDB92E; --brand-yellow-soft:#FFF1D2; --brand-yellow-deep:#F6A600;
    --brand-orange:#F4791F; --brand-orange-soft:#FDE6D2;
    --brand-red:#E1332E; --brand-red-soft:#FCE1DF;
    --brand-blue:#205CA8; --brand-blue-soft:#E3ECF7;
    --brand-green:#00A651;
    --brand-pink:#C24B72; --brand-pink-soft:#F7E3EA;
    --act-claim:var(--brand-blue); --act-claim-soft:var(--brand-blue-soft);
    --act-transfer:var(--brand-orange); --act-transfer-soft:var(--brand-orange-soft);
    --act-return:var(--brand-pink); --act-return-soft:var(--brand-pink-soft);
    --act-extend:var(--brand-yellow-deep); --act-extend-soft:var(--brand-yellow-soft);
    --act-destroy:var(--brand-red); --act-destroy-soft:var(--brand-red-soft);
    --shadow: 0 2px 0 rgba(59,42,24,.15); --radius: 12px; --radius-sm:7px;
    --mono: 'SFMono-Regular', Consolas, 'Courier New', monospace;
    --display: 'Prompt', 'Leelawadee UI', 'Trebuchet MS', system-ui, sans-serif;
    --sans: 'IBM Plex Sans Thai', 'Leelawadee UI', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    --act-give:#0b7d42; --act-give-soft:#DDF2E5; --act-print:#2A1D10;
  }
  *{box-sizing:border-box;}
  html{ -webkit-text-size-adjust:100%; }
  body{ margin:0; background:var(--paper); color:var(--ink); font-family:var(--sans); min-height:100vh; }
  ::selection{ background:var(--brand-blue); color:#fff; }
  button{ font-family:inherit; cursor:pointer; }
  input, select, textarea{ font-family:inherit; font-size:16px; }
  .app{ max-width:1100px; margin:0 auto; padding:16px 14px 90px; }

  /* ---- Masthead: sunburst brand moment ---- */
  .masthead{ position:relative; overflow:hidden; border-radius:var(--radius); border:3px solid var(--ink); margin-bottom:14px;
    background:repeating-conic-gradient(from 0deg, var(--brand-yellow) 0deg 9deg, var(--brand-yellow-soft) 9deg 18deg); padding:16px; }
  .masthead::after{ content:''; position:absolute; inset:0; background:radial-gradient(circle at 20% 15%, rgba(255,255,255,.45), transparent 55%); }
  .masthead-row{ position:relative; z-index:1; display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; }
  .brand-title{ display:flex; align-items:center; gap:10px; background:var(--panel); border:2.5px solid var(--ink); border-radius:var(--radius-sm); padding:8px 14px; box-shadow:var(--shadow); }
  .brand-mark-wrap{ display:flex; flex-direction:column; align-items:flex-start; }
  .brand-mark{ font-family:var(--display); font-weight:900; font-size:22px; letter-spacing:-1px; line-height:1; }
  .brand-mark .c{ color:var(--brand-red); } .brand-mark .j{ color:var(--brand-blue); } .brand-mark .x{ color:var(--brand-green); }
  .brand-mark-rule{ width:100%; height:3px; background:var(--brand-green); border-radius:2px; margin-top:3px; }
  .brand-title h1{ font-family:var(--display); font-size:17px; font-weight:800; margin:0; line-height:1.1; }
  .brand-title .sub{ font-size:10px; color:var(--ink-soft); letter-spacing:1px; text-transform:uppercase; }
  .masthead-actions{ position:relative; z-index:1; display:flex; gap:6px; flex-wrap:wrap; }

  .crumbs{ font-size:12.5px; color:var(--ink-soft); margin:6px 0 16px; }
  .crumbs a{ color:var(--brand-blue); text-decoration:none; cursor:pointer; border-bottom:1px dotted var(--brand-blue); font-weight:600; }
  .crumbs a:hover{ color:var(--brand-red); border-color:var(--brand-red); }

  .btn{ border:2.5px solid var(--ink); background:var(--panel); color:var(--ink); padding:10px 16px; border-radius:var(--radius-sm); font-size:13.5px; font-weight:700; box-shadow:var(--shadow); transition:transform .05s ease; }
  .btn:active{ transform:translateY(2px); box-shadow:none; }
  .btn:hover{ background:var(--paper-dark); }
  .btn-claim{ border-color:var(--act-claim); color:var(--act-claim); } .btn-claim:hover{ background:var(--act-claim-soft); }
  .btn-transfer{ border-color:var(--act-transfer); color:var(--act-transfer); } .btn-transfer:hover{ background:var(--act-transfer-soft); }
  .btn-return{ border-color:var(--act-return); color:var(--act-return); } .btn-return:hover{ background:var(--act-return-soft); }
  .btn-extend{ border-color:var(--act-extend); color:var(--act-extend); } .btn-extend:hover{ background:var(--act-extend-soft); }
  .btn-destroy{ border-color:var(--act-destroy); color:var(--act-destroy); } .btn-destroy:hover{ background:var(--act-destroy-soft); }
  .btn-ghost{ border-color:transparent; box-shadow:none; background:transparent; color:var(--ink-soft); }
  .btn-ghost:hover{ background:var(--paper-dark); }
  .btn-sm{ padding:6px 11px; font-size:12px; }
  .btn:disabled{ opacity:.45; cursor:not-allowed; box-shadow:none; }
  .btn-full{ display:block; width:100%; text-align:center; }

  .folder-grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(240px,1fr)); gap:12px; }
  .folder{ background:var(--panel); border:2.5px solid var(--ink); border-top:8px solid var(--act-claim); border-radius:var(--radius); padding:14px; cursor:pointer; position:relative; box-shadow:var(--shadow); transition:transform .08s ease; }
  .folder:hover{ transform:translateY(-2px); }
  .folder.archived{ border-top-color:var(--ink-faint); opacity:.6; }
  .folder.status-done{ border-top-color:var(--ink-faint); }
  .folder.status-upcoming{ border-top-color:var(--brand-yellow-deep); }
  .folder.status-closed{ border-top-color:var(--brand-orange); }
  .folder h3{ margin:0 0 4px; font-family:var(--display); font-weight:800; font-size:16px; line-height:1.3; }
  .folder .meta{ font-size:11.5px; color:var(--ink-soft); }
  .folder .chips{ display:flex; gap:5px; flex-wrap:wrap; margin:8px 0; }
  .chip{ font-size:10px; padding:3px 9px; border-radius:20px; font-weight:800; letter-spacing:.2px; white-space:nowrap; }
  .chip-type{ background:var(--paper-dark); color:var(--ink-soft); }
  .chip-status-active{ background:var(--act-claim-soft); color:var(--act-claim); }
  .chip-status-upcoming{ background:var(--brand-yellow-soft); color:var(--brand-yellow-deep); }
  .chip-status-done{ background:var(--paper-dark); color:var(--ink-faint); }
  .chip-status-closed{ background:var(--brand-orange-soft); color:var(--brand-orange); }
  .chip-burmese{ background:var(--brand-red-soft); color:var(--brand-red); }
  .chip-team{ background:var(--brand-blue-soft); color:var(--brand-blue); }
  .chip-noteam{ background:var(--brand-yellow-soft); color:var(--brand-yellow-deep); }
  .folder .bar{ height:7px; background:var(--paper-dark); border-radius:6px; margin-top:8px; overflow:hidden; }
  .folder .bar-fill{ height:100%; background:var(--act-claim); }
  .folder .bar-fill.full{ background:var(--act-destroy); }
  .folder .count-line{ font-size:11px; color:var(--ink-soft); margin-top:5px; }
  .folder .tag-archived{ position:absolute; top:10px; right:10px; font-size:9px; letter-spacing:1px; color:var(--ink-faint); text-transform:uppercase; }
  .new-folder{ border:2.5px dashed var(--dash); background:transparent; display:flex; align-items:center; justify-content:center; min-height:100px; border-radius:var(--radius); color:var(--ink-soft); font-size:13.5px; font-weight:700; }
  .new-folder:hover{ border-color:var(--act-claim); color:var(--act-claim); background:var(--act-claim-soft); }

  .panel{ background:var(--panel); border:2.5px solid var(--ink); border-radius:var(--radius); padding:16px; box-shadow:var(--shadow); }
  .panel + .panel{ margin-top:14px; }
  .panel-title{ font-family:var(--display); font-weight:800; font-size:15px; margin:0 0 12px; display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:8px; }

  .plan-head{ display:flex; justify-content:space-between; align-items:flex-start; flex-wrap:wrap; gap:12px; margin-bottom:8px; }
  .plan-head h2{ font-family:var(--display); font-weight:800; font-size:20px; margin:0 0 4px; }
  .plan-head .meta{ font-size:12.5px; color:var(--ink-soft); }
  .toolbar{ display:flex; gap:8px; flex-wrap:wrap; }
  .plan-chips{ display:flex; gap:6px; flex-wrap:wrap; margin:8px 0 10px; }

  .team-banner{ padding:10px 12px; border-radius:var(--radius-sm); font-size:13px; margin-bottom:10px; display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; border:2px solid transparent; }
  .team-banner.assigned{ background:var(--brand-blue-soft); color:var(--brand-blue); border-color:var(--brand-blue); }
  .team-banner.unassigned{ background:var(--brand-yellow-soft); color:var(--brand-yellow-deep); border-color:var(--brand-yellow-deep); font-weight:700; }
  .team-editor{ display:flex; gap:8px; margin-bottom:16px; flex-wrap:wrap; align-items:center; }
  .team-editor select{ border:2px solid var(--ink); padding:7px 9px; border-radius:var(--radius-sm); background:var(--paper); font-size:13px; }
  .closed-banner{ background:var(--brand-orange-soft); color:var(--brand-orange); border:2px solid var(--brand-orange); border-radius:var(--radius-sm); padding:10px 12px; font-size:13px; font-weight:700; margin-bottom:10px; }

  .tabs{ display:flex; gap:2px; border-bottom:2px solid var(--line); margin-bottom:16px; overflow-x:auto; }
  .tab{ padding:8px 14px; font-size:13px; font-weight:700; color:var(--ink-soft); border-bottom:3px solid transparent; background:none; border-left:none;border-right:none;border-top:none; white-space:nowrap; }
  .tab.active{ color:var(--ink); border-bottom-color:var(--brand-red); }

  .coupon-grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(46px,1fr)); gap:2px; border:2px dashed var(--dash); padding:2px; border-radius:var(--radius-sm); }
  .coupon{ aspect-ratio:1/1; display:flex; align-items:center; justify-content:center; font-family:var(--mono); font-size:11px; font-weight:700; color:var(--ink-soft); border:1px dashed var(--dash); background:var(--paper); border-radius:4px; position:relative; min-height:38px; }
  .coupon.owned{ color:var(--ink); border-style:solid; border-color:rgba(0,0,0,.15); }
  .coupon.destroyed{ background:repeating-linear-gradient(45deg, var(--ink-faint), var(--ink-faint) 4px, var(--paper-dark) 4px, var(--paper-dark) 8px); color:var(--panel); text-decoration:line-through; }
  .coupon-legend{ display:flex; flex-wrap:wrap; gap:10px; margin-top:14px; font-size:12px; }
  .legend-chip{ display:flex; align-items:center; gap:6px; }
  .legend-swatch{ width:12px; height:12px; border-radius:3px; border:1px solid rgba(0,0,0,.15); }
  .legend-swatch.destroyed-swatch{ background:repeating-linear-gradient(45deg, var(--ink-faint), var(--ink-faint) 2px, var(--paper-dark) 2px, var(--paper-dark) 4px); }

  table{ width:100%; border-collapse:collapse; font-size:13px; }
  th{ text-align:left; font-size:10.5px; text-transform:uppercase; letter-spacing:.5px; color:var(--ink-soft); border-bottom:2px solid var(--ink); padding:7px 8px; }
  td{ padding:9px 8px; border-bottom:1px solid var(--line); }
  tr:hover td{ background:var(--paper-dark); }
  .owner-swatch{ width:10px; height:10px; border-radius:3px; display:inline-block; margin-right:7px; vertical-align:middle; border:1px solid rgba(0,0,0,.15); }
  .empty-row{ color:var(--ink-faint); font-style:italic; text-align:center; padding:20px; }
  .table-scroll{ overflow-x:auto; }
  .roster-team-row td{ background:var(--brand-blue-soft); color:var(--brand-blue); font-weight:800; font-size:12px; padding:6px 8px; border-bottom:2px solid var(--brand-blue); }

  .filters{ display:flex; gap:8px; margin-bottom:14px; flex-wrap:wrap; }
  .filters input, .filters select{ border:2px solid var(--line); background:var(--panel); padding:8px 11px; border-radius:var(--radius-sm); font-size:13px; }
  .filters input[type=text]{ min-width:180px; flex:1; }

  .overlay{ position:fixed; inset:0; background:rgba(59,42,24,.45); display:flex; align-items:center; justify-content:center; padding:16px; z-index:50; overflow-y:auto; }
  .modal{ background:var(--panel); border:3px solid var(--ink); border-radius:var(--radius); width:100%; max-width:440px; padding:20px; box-shadow:0 10px 0 rgba(59,42,24,.15); max-height:90vh; overflow-y:auto; }
  .modal.wide{ max-width:560px; }
  .modal h3{ font-family:var(--display); font-weight:800; margin:0 0 14px; font-size:18px; border-bottom:2px dashed var(--line); padding-bottom:10px; }
  .field{ margin-bottom:12px; }
  .field label{ display:block; font-size:11.5px; text-transform:uppercase; letter-spacing:.5px; color:var(--ink-soft); margin-bottom:5px; font-weight:700; }
  .field input, .field select{ width:100%; border:2px solid var(--line); border-bottom:3px solid var(--ink); padding:9px 10px; border-radius:var(--radius-sm); font-size:15px; background:var(--paper); }
  .field-row{ display:flex; gap:10px; }
  .field-row .field{ flex:1; }
  .field-check{ display:flex; align-items:center; gap:7px; font-size:13px; margin-bottom:12px; }
  .modal-actions{ display:flex; justify-content:flex-end; gap:8px; margin-top:16px; flex-wrap:wrap; }
  .modal-note{ font-size:12px; color:var(--ink-soft); background:var(--paper-dark); padding:9px 11px; border-radius:var(--radius-sm); margin-top:6px; }
  .modal-error{ font-size:12.5px; color:var(--brand-red); background:var(--brand-red-soft); padding:9px 11px; border-radius:var(--radius-sm); margin-top:10px; font-weight:700; }
  .modal-warning{ font-size:13px; color:var(--brand-orange); background:var(--brand-orange-soft); padding:11px 12px; border-radius:var(--radius-sm); margin-bottom:12px; font-weight:700; border:2px solid var(--brand-orange); }
  .locked-total{ font-family:var(--mono); font-size:15px; font-weight:800; background:var(--act-claim-soft); color:var(--act-claim); padding:10px 11px; border-radius:var(--radius-sm); }
  .modal-tabs{ display:flex; gap:4px; margin-bottom:16px; border-bottom:2px solid var(--line); }
  .modal-tab{ padding:6px 12px; font-size:12.5px; font-weight:700; color:var(--ink-soft); background:none; border:none; border-bottom:3px solid transparent; }
  .modal-tab.active{ color:var(--ink); border-bottom-color:var(--brand-red); }
  .type-row{ display:flex; gap:8px; align-items:center; margin-bottom:8px; }
  .type-row input[type=text]{ flex:2; } .type-row input[type=number]{ flex:1; }
  .link-btn{ background:none; border:none; color:var(--brand-blue); text-decoration:underline; font-size:12.5px; padding:0; font-weight:600; }
  .photo-preview{ max-width:180px; display:block; border:2px solid var(--line); border-radius:var(--radius-sm); margin-top:8px; }
  .photo-lightbox img{ max-width:88vw; max-height:80vh; display:block; border-radius:var(--radius-sm); }
  .destroy-block-list{ font-size:13px; background:var(--paper-dark); border-radius:var(--radius-sm); padding:10px 12px; margin-bottom:10px; }
  .destroy-block-list div{ padding:2px 0; }

  .toast{ position:fixed; bottom:76px; left:50%; transform:translateX(-50%); background:var(--ink); color:var(--paper); padding:11px 18px; border-radius:var(--radius-sm); font-size:13px; box-shadow:0 4px 14px rgba(0,0,0,.25); z-index:100; opacity:0; transition:opacity .2s ease; max-width:90vw; text-align:center; font-weight:600; }
  .toast.show{ opacity:1; }
  .empty-state{ text-align:center; padding:50px 20px; color:var(--ink-soft); }
  .empty-state .big{ font-family:var(--display); font-weight:800; font-size:19px; color:var(--ink); margin-bottom:6px; }
  .file-drop{ border:2.5px dashed var(--dash); border-radius:var(--radius); padding:20px; text-align:center; font-size:13px; color:var(--ink-soft); }
  .file-drop input{ margin-top:10px; }

  /* ---- Help page ---- */
  .help-hero{ background:var(--brand-blue-soft); border:2.5px solid var(--brand-blue); border-radius:var(--radius); padding:16px; margin-bottom:16px; color:var(--brand-blue); font-weight:700; font-size:14px; }
  .help-step{ display:flex; gap:12px; margin-bottom:16px; }
  .help-step .num{ flex:0 0 auto; width:34px; height:34px; border-radius:50%; background:var(--brand-red); color:#fff; display:flex; align-items:center; justify-content:center; font-family:var(--display); font-weight:800; font-size:15px; }
  .help-step .num.destroy{ background:var(--act-destroy); }
  .help-step h4{ margin:0 0 4px; font-family:var(--display); font-weight:800; font-size:15px; }
  .help-step p{ margin:0; font-size:13.5px; color:var(--ink-soft); line-height:1.6; }

  /* ---- Coupon printing + distribution ---- */
  ::selection{ background:var(--brand-blue); color:#fff; }
  :focus-visible{ outline:3px solid var(--brand-blue); outline-offset:2px; }
  .btn-print{ background:var(--act-print); border-color:var(--act-print); color:var(--brand-yellow); } .btn-print:hover{ background:#46321c; }
  .btn-print:disabled{ background:var(--paper-dark); color:var(--ink-faint); border-color:var(--line); }
  .voucher-panel{ display:grid; grid-template-columns:minmax(0,1fr); gap:14px; align-items:start; margin-bottom:14px; }
  .voucher-panel .ticket-preview{ width:100%; height:auto; display:block; border-radius:8px; filter:drop-shadow(0 3px 6px rgba(59,42,24,.18)); }
  .voucher-panel .ticket-empty{ aspect-ratio:105/59.4; border:2.5px dashed var(--dash); border-radius:10px; display:flex; align-items:center; justify-content:center; text-align:center; padding:12px; color:var(--ink-soft); font-size:12.5px; font-weight:600; background:var(--paper); }
  .vp-body{ display:flex; flex-direction:column; gap:10px; min-width:0; }
  .vp-title{ font-family:var(--display); font-weight:800; font-size:16px; margin:0; }
  .vp-sub{ font-size:12.5px; color:var(--ink-soft); }
  .vp-stats{ display:flex; flex-wrap:wrap; gap:6px 18px; }
  .vp-stat{ display:flex; flex-direction:column; }
  .vp-stat b{ font-family:var(--display); font-size:21px; font-weight:800; line-height:1.1; font-variant-numeric:tabular-nums; }
  .vp-stat span{ font-size:11px; color:var(--ink-soft); font-weight:700; }
  .vp-stat.give b{ color:var(--act-give); } .vp-stat.claim b{ color:var(--act-claim); }
  .chip-give{ background:var(--act-give-soft); color:var(--act-give); }
  .schema-warn{ background:var(--brand-yellow-soft); color:#7a4f00; border:2px solid var(--brand-yellow-deep); border-radius:var(--radius-sm); padding:9px 12px; font-size:12.5px; font-weight:600; }
  .seg-row{ display:flex; gap:6px; flex-wrap:wrap; }
  .seg-opt{ border:2px solid var(--line); background:var(--paper); border-radius:var(--radius-sm); padding:7px 12px; font-size:13px; font-weight:700; color:var(--ink-soft); text-align:left; }
  .seg-opt small{ display:block; font-weight:600; font-size:11px; color:var(--ink-faint); }
  .seg-opt[aria-pressed="true"]{ border-color:var(--ink); background:var(--brand-yellow-soft); color:var(--ink); }
  .print-progress{ height:7px; background:var(--paper-dark); border-radius:6px; overflow:hidden; margin-top:8px; }
  .print-progress i{ display:block; height:100%; width:0; background:var(--act-give); transition:width .2s ease; }
  .print-status{ font-size:12.5px; font-weight:700; color:var(--ink-soft); margin-top:8px; min-height:1.2em; }
  .check-list{ display:flex; flex-direction:column; gap:5px; font-size:13px; margin:10px 0; }
  .check-list div{ display:flex; gap:8px; align-items:baseline; }
  .check-list .y{ color:var(--act-give); font-weight:900; } .check-list .w{ color:var(--brand-yellow-deep); font-weight:900; } .check-list .n{ color:var(--brand-red); font-weight:900; }
  .import-summary{ display:grid; grid-template-columns:repeat(auto-fit,minmax(120px,1fr)); gap:8px; background:var(--paper-dark); border-radius:var(--radius-sm); padding:10px 12px; font-size:12px; color:var(--ink-soft); }
  .import-summary b{ display:block; font-size:15px; color:var(--ink); font-family:var(--display); }

  /* ---- Mobile bottom nav ---- */
  .mobile-nav{ display:none; }

  @media (max-width:640px){
    .app{ padding:12px 10px 78px; }
    .coupon-grid{ grid-template-columns:repeat(auto-fill, minmax(38px,1fr)); }
    .brand-title h1{ font-size:15px; } .brand-mark{ font-size:19px; }
    .toolbar{ flex-direction:column; }
    .toolbar .btn{ width:100%; }
    .filters{ flex-direction:column; }
    .filters input, .filters select{ width:100%; }
    .filters input[type=text]{ min-width:0; }
    .overlay{ padding:0; align-items:flex-end; }

<body>

<script>
/* ============ State ============ */
let state = {
  view:'home', planTab:'grid', currentPlanId:null,
  plans:[], planData:null, employees:[], couponTypes:[],
  modal:null, modalTab:'single', modalError:'',
  claimManual:false, transferManual:false, destroyManual:false,
  editingTeam:false, teamManual:false, destroyPhoto:null, editPlanTypeCustom:false,
  homeFilter:{search:'', type:'', status:'all', team:''},
  historyFilterName:'', historyFilterDate:'',
  typeEditRows:[], viewPhotoUrl:null,
  employeeSync:{status:'idle', lastSyncedAt:null, error:null, count:0},
  employeeListFilter:'',
  schemaReady:true, voucherImport:null,
  printOpts:{scope:'all', from:'', to:''},
};

const PALETTE = ['#F4D35E','#F2A6B0','#A7C7E7','#B7E4C7','#F6B26B','#C9B6E4','#E8C1A0','#9FD8D8','#D8B4E2','#C8D96F'];
function colorForKey(name){ if(!name) return '#ffffff'; let h=0; for(let i=0;i<name.length;i++){ h=(h*31+name.charCodeAt(i))>>>0; } return PALETTE[h % PALETTE.length]; }
function escapeHtml(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function showToast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(showToast._t); showToast._t=setTimeout(()=>t.classList.remove('show'),3200); }
function fmtDate(ts){ return new Date(ts).toLocaleString('th-TH', {year:'numeric',month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'}); }
function fmtDateShort(iso){ if(!iso) return '-'; return new Date(iso).toLocaleDateString('th-TH', {year:'2-digit',month:'short',day:'numeric'}); }
function compressRanges(nums){
  if(nums.length===0) return [];
  const sorted=[...nums].sort((a,b)=>a-b); const ranges=[]; let start=sorted[0], prev=sorted[0];
  for(let i=1;i<sorted.length;i++){ if(sorted[i]===prev+1){ prev=sorted[i]; continue; } ranges.push([start,prev]); start=sorted[i]; prev=sorted[i]; }
  ranges.push([start,prev]); return ranges;
}
function rangeLabel(r){ return r[0]===r[1] ? `#${r[0]}` : `#${r[0]}–${r[1]}`; }
function txRangeLabel(t){ if(t.ranges && t.ranges.length){ return t.ranges.map(rangeLabel).join(', '); } return `#${t.rangeFrom}–${t.rangeTo}`; }
function planStatus(plan){
  if(!plan.startDate) return 'unknown';
  const today = new Date(); today.setHours(0,0,0,0);
  // 'YYYY-MM-DD' parses as UTC midnight (07:00 in Thailand); read it as a local date instead
  const start = localDate(plan.startDate); const end = plan.endDate ? localDate(plan.endDate) : start;
  if(today < start) return 'upcoming'; if(today > end) return 'done'; return 'active';
}
const STATUS_LABEL = {upcoming:'ยังไม่เริ่ม', active:'กำลังดำเนินการ', done:'จบแล้ว', unknown:''};
function localDate(iso){ const m=String(iso||'').match(/^(\d{4})-(\d{2})-(\d{2})/); return m ? new Date(+m[1], +m[2]-1, +m[3]) : new Date(iso); }
function canDestroyToday(plan){ if(!plan.endDate) return true; const today=new Date(); today.setHours(0,0,0,0); return today >= localDate(plan.endDate); }

/* ============ Employee helpers ============ */
// Team names can come from two places that don't always agree: the employee roster's
// "team" column (may be blank if that file's header didn't match on import) and the
// team already saved on existing plans (set directly during plan import/assignment).
// Union both so a team already in use is always selectable, even if the roster import
// missed it.
function teamsList(){
  const fromEmployees = state.employees.map(e=>e.team);
  const fromPlans = state.plans.map(p=>p.team);
  return [...new Set([...fromEmployees, ...fromPlans].filter(t=>t && String(t).trim()!==''))].sort();
}
function employeesByTeam(team){ return state.employees.filter(e=>e.team===team).sort((a,b)=>a.nickname.localeCompare(b.nickname)); }
// Branch directory derived from plans already in the system (there's no separate branch
// master table) — powers the searchable ชื่อสาขา dropdown and its matching รหัสสาขา auto-fill
// on the create/edit plan forms. Dedupes by branch code when one exists, else by name.
function branchesList(){
  const seen = new Map();
  state.plans.forEach(p=>{
    const name = (p.name||'').trim(); if(!name) return;
    const code = (p.branchCode||'').trim();
    const key = code || ('name:'+name);
    if(!seen.has(key)) seen.set(key, {name, code});
  });
  return [...seen.values()].sort((a,b)=>a.name.localeCompare(b.name,'th'));
}

/* ============ Block helpers ============ */
function ownerBlocks(){
  const data = state.planData; const byOwner={};
  data.coupons.forEach(c=>{ if(c.owner) (byOwner[c.owner]=byOwner[c.owner]||[]).push(c.no); });
  const blocks=[];
  Object.keys(byOwner).sort().forEach(owner=>{ compressRanges(byOwner[owner]).forEach(r=> blocks.push({owner, from:r[0], to:r[1]})); });
  return blocks;
}
function unclaimedBlocks(){
  const data = state.planData;
  const nums = data.coupons.filter(c=>!c.owner && !c.destroyed).map(c=>c.no);
  return compressRanges(nums).map(r=>({from:r[0], to:r[1]}));
}

/* ============ Row <-> app-state mapping ============ */
function mapPlanRow(p, counts){
  const c = counts[p.id] || {assigned:0, destroyed:0};
  return {
    id: p.id, name: p.name, branchCode: p.branch_code, province: p.province, taskType: p.task_type,
    totalCoupons: p.total_coupons, team: p.team, needsBurmese: p.needs_burmese,
    startDate: p.start_date, endDate: p.end_date, createdAt: new Date(p.created_at).getTime(),
    archived: p.archived, assignedCount: c.assigned, destroyedCount: c.destroyed, voucherCount: c.vouchers||0,
    couponValue: p.coupon_value||20, validFrom: p.valid_from||null, validTo: p.valid_to||null,
    voucherFile: p.voucher_file||null, voucherUploadedAt: p.voucher_uploaded_at||null,
  };
}
function mapTxRow(t){
  return {
    id: t.id, timestamp: new Date(t.ts).getTime(), actionType: t.action_type,
    rangeFrom: t.range_from, rangeTo: t.range_to, ranges: t.ranges, count: t.count,
    previousOwner: t.previous_owner, newOwner: t.new_owner, note: t.note, photo: t.photo_url,

}

/* ============ Bootstrap ============ */
async function init(){
  await loadAllData();
  render();
  // Refresh the employee roster from the live Google Sheet in the background — runs after
  // the first paint (not awaited here) so a slow/unreachable network never blocks app
  // startup; whatever employees were last synced into Supabase are shown immediately, and
  // this quietly brings them up to date and re-renders when it finishes.
  syncEmployeesFromSheet({silent:true});
}

async function loadAllData(){
  try{
    const [{data: plans, error: e1}, {data: coupons, error: e2}, {data: employees, error: e3}, {data: types, error: e4}] = await Promise.all([
      sb.from('plans').select('*'),
      fetchAllCoupons(),
      sb.from('employees').select('*'),
      sb.from('coupon_types').select('*'),
    ]);
    if(e1||e2||e3||e4){ console.error(e1,e2,e3,e4); showToast('เชื่อมต่อฐานข้อมูลไม่สำเร็จ ลองรีเฟรชหน้าใหม่'); return; }
    const counts = {};
    (coupons||[]).forEach(c=>{
      if(!counts[c.plan_id]) counts[c.plan_id] = {assigned:0, destroyed:0};
      if(c.destroyed) counts[c.plan_id].destroyed++; else if(c.owner) counts[c.plan_id].assigned++;
      if(c.voucher) counts[c.plan_id].vouchers=(counts[c.plan_id].vouchers||0)+1;
    });
    state.plans = (plans||[]).map(p=>mapPlanRow(p, counts));
    state.employees = (employees||[]).map(e=>({team:e.team, area:e.area, code:e.code, name:e.name, nickname:e.nickname, gender:e.gender, address:e.address, coordinates:e.coordinates, phone:e.phone}));
    state.couponTypes = (types||[]).map(t=>({name:t.name, count:t.count}));
  } catch(err){
    console.error(err); showToast('เชื่อมต่อฐานข้อมูลไม่สำเร็จ ลองรีเฟรชหน้าใหม่');
  }
}

// The coupons table holds one row per coupon slot across every plan — far beyond the
// 1000-row cap Supabase applies to a single request — so read it in parallel pages.
// Falls back to the original columns when the voucher migration hasn't been run yet.
async function fetchAllCoupons(){
  const cols = state.schemaReady ? 'plan_id, owner, destroyed, voucher' : 'plan_id, owner, destroyed';
  const head = await sb.from('coupons').select('plan_id', {count:'exact', head:true});
  if(head.error) return {data:null, error:head.error};
  const total = head.count||0, size=1000, pages=[];
  for(let from=0; from<Math.max(total,1); from+=size) pages.push(sb.from('coupons').select(cols).order('plan_id').order('no').range(from, from+size-1));
  const res = await Promise.all(pages);
  const bad = res.find(r=>r.error);
  if(bad){
    if(state.schemaReady && /voucher/.test(bad.error.message||'')){ state.schemaReady=false; return fetchAllCoupons(); }
    return {data:null, error:bad.error};
  }
  return {data: res.flatMap(r=>r.data||[]), error:null};
}

/* ============ Navigation ============ */
async function openPlan(id){
  state.currentPlanId = id; state.view='plan'; state.planTab='grid'; state.editingTeam=false; state.teamManual=false;
  state.planData = {coupons:[], transactions:[]};
  render();
  await refreshCurrentPlan();
  render();
}
async function refreshCurrentPlan(){
  const plan = currentPlan(); if(!plan) return;
  const [{data: coupons, error: e1}, {data: txs, error: e2}] = await Promise.all([
    sb.from('coupons').select(state.schemaReady ? 'no, owner, destroyed, voucher' : 'no, owner, destroyed').eq('plan_id', plan.id).order('no').range(0, 9999),
    sb.from('transactions').select('*').eq('plan_id', plan.id).order('ts', {ascending:false}),
  ]);
  if(e1 && state.schemaReady && /voucher/.test(e1.message||'')){ state.schemaReady=false; return refreshCurrentPlan(); }
  if(e1||e2){ console.error(e1,e2); showToast('โหลดข้อมูลแผนงานไม่สำเร็จ'); return; }
  state.planData = { coupons: coupons||[], transactions: (txs||[]).map(mapTxRow) };
  plan.assignedCount = state.planData.coupons.filter(c=>c.owner).length;
  plan.destroyedCount = state.planData.coupons.filter(c=>c.destroyed).length;
  plan.voucherCount = state.planData.coupons.filter(c=>c.voucher).length;
}
function goHome(){ state.view='home'; state.currentPlanId=null; state.planData=null; render(); }
function goHelp(){ state.view='help'; render(); }
function openModal(name){ state.modal=name; state.modalError=''; state.modalTab='single'; state.destroyPhoto=null;
  if(name==='settingsTypes'){ state.typeEditRows = state.couponTypes.map(t=>({...t})); }
  if(name==='importEmployees'){ state.employeeListFilter=''; }
  if(name==='editPlan'){ const p=currentPlan(); state.editPlanTypeCustom = !!(p && !state.couponTypes.find(t=>t.name===p.taskType)); }
  render();
}
function closeModal(){ state.modal=null; state.modalError=''; state.destroyPhoto=null; render(); }
function currentPlan(){ return state.plans.find(p=>p.id===state.currentPlanId); }

/* ============ Plan CRUD ============ */
async function createPlanSingle(fields){
  const name = fields.name.trim();
  if(!name){ state.modalError='กรุณาใส่ชื่อสาขา/แผนงาน'; render(); return; }
  let total, taskType;
  if(fields.typeMode==='custom'){
    const cname = fields.customName.trim(); const ccount = parseInt(fields.customCount,10);
    if(!cname || !ccount || ccount<1){ state.modalError='กรุณาใส่ชื่อประเภทงานและจำนวนคูปองให้ถูกต้อง'; render(); return; }
    taskType = cname; total = ccount;
    if(!state.couponTypes.find(t=>t.name===cname)){
      await sb.from('coupon_types').upsert({name:cname, count:ccount}, {onConflict:'name'});
      state.couponTypes.push({name:cname, count:ccount});
    }
  } else {
    const t = state.couponTypes.find(t=>t.name===fields.typeName);
    if(!t){ state.modalError='กรุณาเลือกประเภทงาน'; render(); return; }
    taskType = t.name; total = t.count;
  }
  const id = 'p_'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
  const { error: e1 } = await sb.from('plans').insert({
    id, name, branch_code: fields.branchCode.trim(), province: fields.province.trim(),
    task_type: taskType, total_coupons: total, team: fields.team || null, needs_burmese: fields.needsBurmese,
    start_date: fields.startDate || null, end_date: fields.endDate || null, archived: false,
  });
  if(e1){ console.error(e1); state.modalError='บันทึกแผนงานไม่สำเร็จ: '+e1.message; render(); return; }
  if(total>0){
    const rows = Array.from({length: total}, (_,i)=>({plan_id:id, no:i+1, owner:null, destroyed:false}));
    const { error: e2 } = await sb.from('coupons').insert(rows);
    if(e2) console.error(e2);
  }
  await loadAllData();
  closeModal();
  showToast(`สร้างแผนงาน "${name}" เรียบร้อย — คูปอง 1–${total} (ล็อคตามประเภท "${taskType}")`);
  openPlan(id);
}

// Lets the user fix a plan's own fields directly (name, branch code, dates, task type,
// team-less coupon count) instead of me editing the live database by hand — useful for
// correcting a mis-imported plan (wrong date range, wrong/missing coupon type) or a
// duplicate created by an import quirk, without waiting on a code fix each time.
async function saveEditPlan(fields){
  const plan = currentPlan(); if(!plan) return;
  const name = (fields.name||'').trim();
  if(!name){ state.modalError='กรุณาใส่ชื่อสาขา/แผนงาน'; render(); return; }

  let total, taskType;
  if(fields.typeMode==='custom'){
    const cname = (fields.customName||'').trim(); const ccount = parseInt(fields.customCount,10);
    if(!cname || isNaN(ccount) || ccount<0){ state.modalError='กรุณาใส่ชื่อประเภทงานและจำนวนคูปองให้ถูกต้อง'; render(); return; }
    taskType = cname; total = ccount;
    if(!state.couponTypes.find(t=>t.name===cname)){
      await sb.from('coupon_types').upsert({name:cname, count:ccount}, {onConflict:'name'});
      state.couponTypes.push({name:cname, count:ccount});
    }
  } else {
    const t = state.couponTypes.find(t=>t.name===fields.typeName);
    if(!t){ state.modalError='กรุณาเลือกประเภทงาน'; render(); return; }
    taskType = t.name; total = t.count;
  }

  // Never let a resize erase a coupon slot that's already been claimed or destroyed —
  // block shrinking below the highest such slot number instead of silently deleting it.
  const usedNos = state.planData.coupons.filter(c=>c.owner||c.destroyed).map(c=>c.no);
  const maxUsed = usedNos.length ? Math.max(...usedNos) : 0;
  if(total < maxUsed){
    state.modalError = `ลดจำนวนคูปองต่ำกว่า ${maxUsed} ใบไม่ได้ เพราะมีการเบิก/ทำลายไปถึงเบอร์นั้นแล้ว`;
    render(); return;
  }

  const oldTotal = plan.totalCoupons;
  if(total > oldTotal){
    const rows = Array.from({length: total-oldTotal}, (_,i)=>({plan_id:plan.id, no:oldTotal+1+i, owner:null, destroyed:false}));
    const { error } = await sb.from('coupons').insert(rows);
    if(error){ console.error(error); state.modalError='เพิ่มคูปองไม่สำเร็จ: '+error.message; render(); return; }
  } else if(total < oldTotal){
    const { error } = await sb.from('coupons').delete().eq('plan_id',plan.id).gt('no', total);
    if(error){ console.error(error); state.modalError='ลดจำนวนคูปองไม่สำเร็จ: '+error.message; render(); return; }
  }

  const branchCode = (fields.branchCode||'').trim(), province = (fields.province||'').trim();
  const startDate = fields.startDate || null, endDate = fields.endDate || null, needsBurmese = !!fields.needsBurmese;
  const { error: e1 } = await sb.from('plans').update({
    name, branch_code: branchCode, province, task_type: taskType, total_coupons: total,
    start_date: startDate, end_date: endDate, needs_burmese: needsBurmese,
  }).eq('id', plan.id);
  if(e1){ console.error(e1); state.modalError='บันทึกไม่สำเร็จ: '+e1.message; render(); return; }

  Object.assign(plan, { name, branchCode, province, taskType, totalCoupons: total, startDate, endDate, needsBurmese });
  await refreshCurrentPlan();
  closeModal();
  showToast(`บันทึกการแก้ไขแผนงาน "${name}" แล้ว`);
  render();
}

async function deletePlanConfirm(){
  const plan = currentPlan(); if(!plan) return;
  const assignedCount = state.planData.coupons.filter(c=>c.owner).length;
  const warn = assignedCount>0 ? `\n\n⚠️ มีคูปองที่เบิกไปแล้ว ${assignedCount} ใบในแผนงานนี้ — ลบแล้วประวัติการเบิกจะหายไปด้วย` : '';
  if(!window.confirm(`ลบแผนงาน "${plan.name}" (${plan.branchCode||'-'}) ทิ้งทั้งหมด? การลบนี้กู้คืนไม่ได้${warn}`)) return;
  const { error } = await sb.from('plans').delete().eq('id', plan.id);
  if(error){ console.error(error); showToast('ลบไม่สำเร็จ: '+error.message); return; }
  const name = plan.name;
  state.plans = state.plans.filter(p=>p.id!==plan.id);
  // Close the modal state directly instead of calling closeModal() here: closeModal() would
  // render() immediately, but state.view/currentPlanId still point at the plan we just
  // removed from state.plans, so renderPlan() would crash reading .name off an undefined
  // currentPlan(). goHome() resets view/currentPlanId together and renders once, safely.
  state.modal = null; state.modalError = ''; state.destroyPhoto = null;
  goHome();
  showToast(`ลบแผนงาน "${name}" แล้ว`);
}

async function toggleArchive(id){
  const plan = state.plans.find(p=>p.id===id); if(!plan) return;
  const newVal = !plan.archived;
  const { error } = await sb.from('plans').update({archived:newVal}).eq('id', id);
  if(error){ console.error(error); showToast('อัปเดตไม่สำเร็จ'); return; }
  plan.archived = newVal;
  showToast(plan.archived ? 'ย้ายแผนงานไปเก็บถาวรแล้ว' : 'กู้คืนแผนงานแล้ว'); render();
}

async function assignTeam(team){
  team = (team||'').trim();
  if(!team){ state.modalError='กรุณาเลือกทีม'; render(); return; }
  const plan = currentPlan();
  const { error } = await sb.from('plans').update({team}).eq('id', plan.id);
  if(error){ console.error(error); showToast('บันทึกทีมไม่สำเร็จ'); return; }
  plan.team = team; state.editingTeam = false;
  showToast(`กำหนดทีม ${team} ให้แผนงาน "${plan.name}" แล้ว`); render();
}

async function claimCoupons(employee, count){
  employee = employee.trim(); count = parseInt(count,10);
  const plan = currentPlan(); const data = state.planData;
  if(!plan.team){ state.modalError='กรุณากำหนดทีมที่รับผิดชอบแผนงานนี้ก่อน'; render(); return; }
  if(!employee){ state.modalError='กรุณาเลือกหรือกรอกชื่อพนักงาน'; render(); return; }
  if(!count || count<1){ state.modalError='จำนวนที่เบิกต้องมากกว่า 0'; render(); return; }
  // Claim the LOWEST unclaimed numbers first (via unclaimedBlocks, which already excludes
  // owned + destroyed coupons) instead of always continuing after the historical max-ever-
  // assigned number. That old approach permanently skipped any numbers freed by a "คืนคูปอง"
  // (return) — e.g. #1–5 claimed then returned would never be reissued, since the next claim
  // started right after whatever higher number was already assigned to someone else. Numbers
  // freed by a return are now first in line to be handed out again.
  const freeNums = []; unclaimedBlocks().forEach(b=>{ for(let n=b.from;n<=b.to;n++) freeNums.push(n); });
  if(freeNums.length===0){ state.modalError='คูปองในแผนงานนี้ถูกเบิกหมดแล้ว กด "ขอคูปองเพิ่ม" ก่อน'; render(); return; }
  const actualCount = Math.min(count, freeNums.length);
  const claimBlocks = compressRanges(freeNums.slice(0, actualCount));
  for(const r of claimBlocks){
    const { error: e1 } = await sb.from('coupons').update({owner:employee}).eq('plan_id', plan.id).gte('no', r[0]).lte('no', r[1]);
    if(e1){ console.error(e1); state.modalError='บันทึกไม่สำเร็จ: '+e1.message; render(); return; }
    const { error: e2 } = await sb.from('transactions').insert({
      plan_id: plan.id, action_type:'เบิก', range_from:r[0], range_to:r[1], previous_owner:null, new_owner:employee, note:'' });
    if(e2) console.error(e2);
  }
  await refreshCurrentPlan();
  closeModal();
  const label = claimBlocks.map(rangeLabel).join(', ');
  showToast(actualCount<count ? `เบิกให้ ${employee} ได้เพียง ${label} (${actualCount} ใบ) เพราะคูปองไม่พอ` : `${employee} เบิกคูปอง ${label} เรียบร้อย`);
  render();
}

async function transferCoupons(from, to, newOwner){
  from=parseInt(from,10); to=parseInt(to,10); newOwner=newOwner.trim();
  const plan = currentPlan(); const data = state.planData;
  if(!newOwner){ state.modalError='กรุณาเลือกหรือกรอกชื่อเจ้าของใหม่'; render(); return; }
  if(!from || !to || from<1 || to>plan.totalCoupons || from>to){ state.modalError='ช่วงเบอร์ไม่ถูกต้อง'; render(); return; }
  const segment=[]; for(let n=from;n<=to;n++){ segment.push(data.coupons.find(c=>c.no===n)); }
  const unowned = segment.filter(c=>!c.owner);
  if(unowned.length>0){ state.modalError = `เบอร์ ${unowned.map(c=>'#'+c.no).join(', ')} ยังไม่มีเจ้าของ ต้องเบิกก่อนจึงจะโอนได้`; render(); return; }
  let segStart=segment[0].no, segOwner=segment[0].owner; const subTx=[];
  for(let i=1;i<=segment.length;i++){
    const c = segment[i];
    if(!c || c.owner!==segOwner){ subTx.push({from:segStart, to:segment[i-1].no, prevOwner:segOwner}); if(c){ segStart=c.no; segOwner=c.owner; } }
  }
  for(const tx of subTx){
    const { error: e1 } = await sb.from('coupons').update({owner:newOwner}).eq('plan_id', plan.id).gte('no', tx.from).lte('no', tx.to);
    if(e1) console.error(e1);
    const { error: e2 } = await sb.from('transactions').insert({
      plan_id: plan.id, action_type:'โอน', range_from:tx.from, range_to:tx.to, previous_owner:tx.prevOwner, new_owner:newOwner, note:'' });
    if(e2) console.error(e2);
  }
  await refreshCurrentPlan();
  closeModal();
  showToast(`โอนคูปอง #${from}–${to} ให้ ${newOwner} เรียบร้อย (${subTx.length} รายการ)`);
  render();
}

async function returnCoupons(from, to){

function dataURLtoBlob(dataUrl){
  const [header, base64] = dataUrl.split(',');
  const mime = header.match(/:(.*?);/)[1];
  const binary = atob(base64);
  const arr = new Uint8Array(binary.length);
  for(let i=0;i<binary.length;i++) arr[i]=binary.charCodeAt(i);
  return new Blob([arr], {type:mime});
}

async function destroyAllRemaining(destroyedBy, note, photo){
  const plan = currentPlan();
  destroyedBy = (destroyedBy||'').trim();
  if(!canDestroyToday(plan)){ state.modalError='ทำลายคูปองได้เฉพาะวันสุดท้ายของงานเท่านั้น'; render(); return; }

    const fileName = `${plan.id}-${Date.now()}.jpg`;

    const { error: upErr } = await sb.storage.from(PHOTO_BUCKET).upload(fileName, blob, {contentType:'image/jpeg'});

  }

  let count=0;
  for(const b of blocks){

  const { error: e2 } = await sb.from('transactions').insert({
    plan_id: plan.id, action_type:'ทำลาย', ranges: blocks.map(b=>[b.from,b.to]), count,

  await refreshCurrentPlan();

  render();
}

// Ticket frame; mirrored puts the stub on the left (back side of a duplex sheet)
function cpFrame(x, W, H, th, mirrored, opt){

  const inH=H-pad*2-f*2, top=pad+f;
  const stubX = mirrored ? pad+f : W-pad-f-stubW;
  const mainX = mirrored ? stubX+stubW+gap : pad+f;
  const mainW = W-pad*2-f*2-stubW-gap;
  const divX = mirrored ? stubX+stubW+gap/2 : mainX+mainW+gap/2;
  x.fillStyle=CP_PAPER; cpRound(x,mainX,top,mainW,inH,2); x.fill(); cpRound(x,stubX,top,stubW,inH,2); x.fill();
  for(const [cx,cy,r] of [[divX,pad,nr],[divX,H-pad,nr],[pad,H/2,nr*0.74],[W-pad,H/2,nr*0.74]]){ x.beginPath(); x.arc(cx,cy,r,0,Math.PI*2); x.fill(); }

function cpBars(value){
  const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');
  JsBarcode(svg, value, {format: /^\d+$/.test(value) && value.length%2===0 ? 'CODE128C' : 'CODE128', width:1, height:10, margin:0, displayValue:false});
  const out=[]; svg.querySelectorAll('g rect').forEach(r=>out.push([+r.getAttribute('x'), +r.getAttribute('width')]));
  return {bars:out, modules:parseFloat(svg.getAttribute('width'))};
}
function cpStubBarcode(t, value){
  const b=cpBars(value), len=b.modules*CP_MOD, x0=t.fr.stubX+(t.fr.stubW-len)/2;
  return {rects:b.bars.map(([bx,bw])=>[x0+bx*CP_MOD, t.st.by, bw*CP_MOD, t.st.bh]), len, x0};
}
let cpReader=null;
// Independent check: decode the exact bar pattern we are about to print
function cpDecode(value){
  const {bars, modules}=cpBars(value);
  const px=3, quiet=60, h=60, w=modules*px+quiet*2;
  const lum=new Uint8ClampedArray(w*h).fill(255);
  for(const [x0,bw] of bars){ for(let xx=quiet+x0*px; xx<quiet+(x0+bw)*px; xx++){ for(let y=0;y<h;y++) lum[y*w+xx]=0; } }
  if(!cpReader){
    cpReader=new ZXing.MultiFormatReader();
    const hints=new Map(); hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS,[ZXing.BarcodeFormat.CODE_128]); hints.set(ZXing.DecodeHintType.TRY_HARDER,true);
    cpReader.setHints(hints);
  }
  try{ return cpReader.decodeWithState(new ZXing.BinaryBitmap(new ZXing.HybridBinarizer(new ZXing.RGBLuminanceSource(lum,w,h)))).getText(); }catch(e){ return null; }
}
const cpSpaced = v => v.replace(/(\d{4})(?=\d)/g,'$1 ');
function cpBuildPdf(c, items){
  const t=cpFront(c,14), g=cpGeo('L10');
  const img=t.canvas.toDataURL('image/png');
  const doc=new window.jspdf.jsPDF({unit:'mm', format:'a4', orientation:'portrait', compress:true});
  const per=g.rows;
  for(let p=0;p*per<items.length;p++){
    const chunk=items.slice(p*per,(p+1)*per);
    if(p>0) doc.addPage();
    chunk.forEach((it,k)=>{
      const oy=k*g.ch;
      doc.addImage(img,'PNG',0,oy,g.cw,g.ch,'front','FAST');
      const bc=cpStubBarcode(t,it.v); doc.setFillColor(0,0,0);
      for(const [rx,ry,rw,rh] of bc.rects) doc.rect(rx,oy+ry,rw,rh,'F');
      doc.setFont('courier','bold'); doc.setFontSize(8.2); doc.setTextColor(29,29,27);
      doc.text(cpSpaced(it.v), bc.x0+bc.len/2, oy+t.st.digitsY, {align:'center'});
      doc.setFont('helvetica','bold'); doc.setFontSize(t.no.size*2.835); doc.setTextColor(255,255,255);
      doc.text(`No. ${String(it.no).padStart(4,'0')}`, t.no.cx, oy+t.no.cy+t.no.size*0.36, {align:'center'});
    });
    doc.setDrawColor(170,178,175); doc.setLineWidth(0.12); doc.setLineDashPattern([1.5,1.5],0);
    for(let r=1;r<g.rows;r++) doc.line(0,r*g.ch,CP_PAGE.w,r*g.ch);
    doc.setLineDashPattern([],0);
  }
  return doc;
}
function couponSpec(plan){

/* ---- nest voucher file → plan ---- */
function cpCellText(cell){
  if(!cell) return '';
  if(cell.t==='n') return Number.isInteger(cell.v) ? BigInt(Math.round(cell.v)).toString() : String(cell.v);
  return String(cell.w ?? cell.v ?? '').trim();
}
function cpParseDmy(s){
  const m=String(s||'').trim().match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})$/);
  if(!m) return null; let y=+m[3]; if(y>2400) y-=543;
  return `${y}-${String(+m[2]).padStart(2,'0')}-${String(+m[1]).padStart(2,'0')}`;
}
// The page keeps a copy of the plan list; if someone deleted the plan meanwhile, writes fail on a foreign key
async function planStillExists(plan){
  const {data, error} = await sb.from('plans').select('id').eq('id', plan.id).limit(1);
  return !error && !!(data && data.length);
}
const PLAN_GONE_MSG = 'แผนงานนี้ไม่อยู่ในระบบแล้ว (มีคนกดลบ/ล้างแผนงาน หรือหน้านี้เก่า) กด F5 โหลดหน้าใหม่ แล้วนำเข้าแผนงานอีกครั้ง จึงอัปโหลดเลขคูปองได้';
async function handleVoucherFile(file){
  const plan=currentPlan();
  if(!(await planStillExists(plan))){ state.voucherImport=null; state.modalError=PLAN_GONE_MSG; render(); return; }
  state.voucherImport={fileName:file.name, status:'reading'}; state.modalError=''; render();
  try{
    const wb=XLSX.read(await file.arrayBuffer(), {type:'array'});
    const ws=wb.Sheets[wb.SheetNames[0]]; const ref=XLSX.utils.decode_range(ws['!ref']);
    const rows=[]; for(let r=ref.s.r;r<=ref.e.r;r++){ const row=[]; for(let col=ref.s.c;col<=ref.e.c;col++) row.push(cpCellText(ws[XLSX.utils.encode_cell({r,c:col})])); rows.push(row); }
    const hi=rows.findIndex(r=>r.some(v=>/voucher\s*no/i.test(v)));
    if(hi<0) throw new Error('ไม่พบคอลัมน์ Voucher No. ไฟล์นี้อาจไม่ใช่ไฟล์เลขคูปองจาก nest');
    const H=rows[hi].map(h=>String(h).toLowerCase()); const col=re=>H.findIndex(h=>re.test(h));
    const cStore=col(/store\s*code/), cRun=col(/running/), cV=col(/voucher\s*no/), cVal=col(/value/), cEf=col(/effective\s*date/), cXd=col(/expir\w*\s*date/);
    const items=[]; const stores=new Set();
    rows.slice(hi+1).forEach((r,i)=>{ const v=String(r[cV]||'').replace(/\s/g,''); if(!v) return; items.push({no: parseInt(r[cRun],10) || (items.length+1), v}); if(cStore>=0 && r[cStore]) stores.add(String(r[cStore]).trim().toUpperCase()); });
    if(!items.length) throw new Error('ไม่พบเลขคูปองในไฟล์');
    const first=rows[hi+1]||[];
    const imp={fileName:file.name, status:'ready', items, stores:[...stores], value:Number(first[cVal])||20, validFrom:cpParseDmy(first[cEf]), validTo:cpParseDmy(first[cXd]), checks:[]};
    const nums=items.map(i=>i.v), dup=nums.length-new Set(nums).size, bad=nums.filter(v=>!/^\d{16}$/.test(v)).length;
    const noDup=items.length-new Set(items.map(i=>i.no)).size;
    imp.checks.push(dup ? {s:'n',t:`เลขคูปองซ้ำกันในไฟล์ ${dup} เลข`} : {s:'y',t:`เลขคูปองไม่ซ้ำกัน ${nums.length} เลข`});
    imp.checks.push(bad ? {s:'n',t:`มีเลขที่ไม่ใช่ตัวเลข 16 หลัก ${bad} เลข`} : {s:'y',t:'เลขคูปองเป็นตัวเลข 16 หลักครบทุกใบ'});
    if(noDup) imp.checks.push({s:'n',t:`Running No. ซ้ำกัน ${noDup} แถว`});
    const code=(plan.branchCode||'').trim().toUpperCase();
    if(imp.stores.length>1) imp.checks.push({s:'n',t:`ไฟล์มีหลายสาขา: ${imp.stores.join(', ')}`});
    else if(code && imp.stores[0] && imp.stores[0]!==code) imp.checks.push({s:'n',t:`รหัสสาขาในไฟล์ ${imp.stores[0]} ไม่ตรงกับแผนงานนี้ (${code})`});
    else if(imp.stores[0]) imp.checks.push({s:'y',t:`รหัสสาขาตรงกัน (${imp.stores[0]})`});
    const maxNo=Math.max(...items.map(i=>i.no));
    if(maxNo>plan.totalCoupons) imp.checks.push({s:'w',t:`ไฟล์มีถึงเบอร์ ${maxNo} แต่แผนงานมี ${plan.totalCoupons} ช่อง ระบบจะขยายให้อัตโนมัติ`});
    else if(items.length<plan.totalCoupons) imp.checks.push({s:'w',t:`ไฟล์มี ${items.length} ใบ น้อยกว่าแผนงาน (${plan.totalCoupons} ช่อง) เบอร์ที่ไม่มีเลขจะพิมพ์ไม่ได้`});
    else imp.checks.push({s:'y',t:`จำนวนตรงกับแผนงาน (${items.length} ใบ)`});
    if(imp.validFrom && plan.startDate && imp.validFrom!==plan.startDate) imp.checks.push({s:'w',t:`วันเริ่มใช้คูปอง (${fmtDateShort(imp.validFrom)}) ไม่ตรงวันเริ่มงาน (${fmtDateShort(plan.startDate)})`});
    // Same voucher already sitting in another plan?
    const clash=new Map();
    for(let i=0;i<nums.length;i+=150){
      const {data, error}=await sb.from('coupons').select('plan_id,voucher').in('voucher', nums.slice(i,i+150));
      if(error){ if(/voucher/.test(error.message||'')){ state.schemaReady=false; throw new Error('ฐานข้อมูลยังไม่มีคอลัมน์เลขคูปอง — '+COUPON_SQL_HINT); } throw error; }
      (data||[]).filter(d=>d.plan_id!==plan.id).forEach(d=>clash.set(d.plan_id,(clash.get(d.plan_id)||0)+1));
    }
    if(clash.size) imp.checks.push({s:'n',t:'เลขคูปองซ้ำกับแผนงานอื่น: '+[...clash].map(([id,n])=>`${(state.plans.find(p=>p.id===id)||{}).name||id} (${n} เลข)`).join(', ')});
    state.voucherImport=imp;
  }catch(err){ console.error(err); state.voucherImport=null; state.modalError=err.message||String(err); }
  render();
}
async function confirmVoucherImport(){
  const plan=currentPlan(), imp=state.voucherImport;
  if(!imp || imp.status!=='ready') return;
  if(imp.checks.some(c=>c.s==='n')){ state.modalError='แก้รายการสีแดงก่อน หรือเลือกไฟล์ที่ถูกต้อง'; render(); return; }
  if(!(await planStillExists(plan))){ state.voucherImport=null; state.modalError=PLAN_GONE_MSG; render(); return; }
  imp.status='saving'; render();
  try{
    const maxNo=Math.max(...imp.items.map(i=>i.no));
    if(maxNo>plan.totalCoupons){
      const oldTotal=plan.totalCoupons;
      const add=Array.from({length:maxNo-oldTotal},(_,i)=>({plan_id:plan.id, no:oldTotal+1+i, owner:null, destroyed:false}));
      const {error:e0}=await sb.from('coupons').insert(add); if(e0) throw e0;
      await sb.from('plans').update({total_coupons:maxNo}).eq('id',plan.id);
      await sb.from('transactions').insert({plan_id:plan.id, action_type:'ขยาย', range_from:oldTotal+1, range_to:maxNo, previous_owner:null, new_owner:null, note:'ขยายตามไฟล์เลขคูปองจาก nest'});
      plan.totalCoupons=maxNo;
    }
    // clear old numbers first so a re-upload never leaves stale vouchers behind
    const {error:e1}=await sb.from('coupons').update({voucher:null}).eq('plan_id',plan.id); if(e1) throw e1;
    for(let i=0;i<imp.items.length;i+=500){
      const chunk=imp.items.slice(i,i+500).map(it=>({plan_id:plan.id, no:it.no, voucher:it.v}));
      const {error}=await sb.from('coupons').upsert(chunk,{onConflict:'plan_id,no'}); if(error) throw error;
    }
    const patch={coupon_value:imp.value, valid_from:imp.validFrom, valid_to:imp.validTo, voucher_file:imp.fileName, voucher_uploaded_at:new Date().toISOString()};
    const {error:e2}=await sb.from('plans').update(patch).eq('id',plan.id); if(e2) throw e2;
    Object.assign(plan,{couponValue:imp.value, validFrom:imp.validFrom, validTo:imp.validTo, voucherFile:imp.fileName, voucherUploadedAt:patch.voucher_uploaded_at});
    await sb.from('transactions').insert({plan_id:plan.id, action_type:'ใส่เลขคูปอง', range_from:Math.min(...imp.items.map(i=>i.no)), range_to:maxNo, count:imp.items.length, previous_owner:null, new_owner:null, note:imp.fileName});
    state.voucherImport=null;
    await refreshCurrentPlan(); closeModal();
    showToast(`ใส่เลขคูปองจาก nest แล้ว ${imp.items.length} ใบ พร้อมให้ทีมพิมพ์`);
  }catch(err){
    console.error(err); imp.status='ready';
    if(/foreign key/i.test(err.message||'')){ state.voucherImport=null; state.modalError=PLAN_GONE_MSG; render(); return; }
    state.modalError='บันทึกไม่สำเร็จ: '+(err.message||err)+(/column|voucher|relation|constraint/i.test(err.message||'')?' — '+COUPON_SQL_HINT:'');
    render();
  }
}
/* ---- print ---- */
function printableItems(scope, from, to){
  const data=state.planData;
  return data.coupons.filter(c=>c.voucher && !c.destroyed && (scope!=='range' || (c.no>=from && c.no<=to))).sort((a,b)=>a.no-b.no).map(c=>({no:c.no, v:c.voucher}));

function setPrintStatus(msg, pct){
  const el=document.getElementById('print-status'); if(el) el.textContent=msg;
  const bar=document.getElementById('print-bar'); if(bar){ bar.parentElement.hidden = pct==null; if(pct!=null) bar.style.width=Math.round(pct*100)+'%'; }
}
async function printCoupons(){
  const plan=currentPlan(), o=state.printOpts;
  const from=parseInt(o.from,10), to=parseInt(o.to,10);
  if(o.scope==='range' && (!from || !to || from>to)){ state.modalError='ใส่ช่วงเบอร์ให้ถูกต้อง'; render(); return; }
  const items=printableItems(o.scope, from, to);
  if(!items.length){ state.modalError='ไม่มีคูปองที่มีเลขจริงในช่วงนี้ให้พิมพ์'; render(); return; }
  if(typeof ZXing==='undefined' || typeof JsBarcode==='undefined' || !window.jspdf){ state.modalError='โหลดเครื่องมือสร้าง PDF ไม่สำเร็จ ลองรีเฟรชหน้า'; render(); return; }
  const btn=document.querySelector('[data-act="submitPrint"]'); if(btn) btn.disabled=true;
  state.modalError='';
  let ok=0; const failed=[];
  for(let i=0;i<items.length;i++){
    if(cpDecode(items[i].v)===items[i].v) ok++; else failed.push(items[i].no);
    if(i%25===0){ setPrintStatus(`กำลังสแกนตรวจบาร์โค้ด ${i}/${items.length}`, i/items.length*0.85); await new Promise(r=>setTimeout(r)); }
  }
  if(failed.length){ setPrintStatus(`สแกนไม่ผ่าน ${failed.length} ใบ (เบอร์ ${failed.slice(0,5).join(', ')}) ยังไม่ออก PDF`, null); if(btn) btn.disabled=false; return; }
  setPrintStatus(`สแกนผ่าน ${ok}/${items.length} ใบ กำลังสร้าง PDF…`, 0.9);
  await cpFontsReady(); await new Promise(r=>setTimeout(r,30));
  const spec=couponSpec(plan);
  const doc=cpBuildPdf(spec, items);
  const d=spec.from ? `${spec.from.getDate()}-${spec.from.getMonth()+1}` : '';
  const scopeLabel = o.scope==='range' ? `_เบอร์${from}-${to}` : '';
  doc.save(`คูปอง${spec.value}บาท_${plan.name}_${d}${scopeLabel}_${items.length}ใบ.pdf`.replace(/[\/:*?"<>|]/g,'-'));
  const ranges=compressRanges(items.map(i=>i.no));
  await sb.from('transactions').insert({plan_id:plan.id, action_type:'พิมพ์', ranges, count:items.length, previous_owner:null, new_owner:null, note:'ใบยาว 10 ใบ/หน้า'});
  await refreshCurrentPlan();
  closeModal();
  showToast(`ดาวน์โหลด PDF แล้ว ${items.length} ใบ — สแกนตรวจบาร์โค้ดผ่านทุกใบ`);
}

/* ============ Reset all plans ============ */
async function cleanupOldPlans(){
  const done = state.plans.filter(p=>!p.archived && planStatus(p)==='done');
  const upcoming = state.plans.filter(p=>!p.archived && planStatus(p)==='upcoming');
  if(done.length===0 && upcoming.length===0){ showToast('ไม่มีแผนงานที่ต้องจัดการ (ไม่มีงานที่จบแล้วหรือยังไม่เริ่ม)'); return; }
  const msg = `จะดำเนินการดังนี้:\n- จัดเก็บ (archive) แผนงานที่จบแล้ว ${done.length} รายการ\n- ลบแผนงานที่ยังไม่เริ่ม ${upcoming.length} รายการ (ลบไม่สามารถกู้คืนได้)\n- แผนงานที่กำลังดำเนินการจะไม่ถูกแตะต้อง\n\nยืนยันหรือไม่?`;
  if(!window.confirm(msg)) return;
  for(const p of done){
    const { error } = await sb.from('plans').update({archived:true}).eq('id', p.id);
    if(!error) p.archived = true; else console.error(error);
  }
  if(upcoming.length){
    const ids = upcoming.map(p=>p.id);
    const { error } = await sb.from('plans').delete().in('id', ids);
    if(!error) state.plans = state.plans.filter(p=>!ids.includes(p.id)); else console.error(error);
  }
  showToast(`จัดเก็บแผนงานที่จบแล้ว ${done.length} รายการ และลบแผนงานที่ยังไม่เริ่ม ${upcoming.length} รายการเรียบร้อย`);
  render();
}

/* ============ Excel import ============ */
function readWorkbook(file){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    // raw:true here disables SheetJS's CSV/DSV cell-type sniffing (numbers, dates, booleans),
    // so a plain-text date like "1/10/2026" in an uploaded CSV comes through as that exact
    // string instead of being silently guessed-and-converted to an Excel serial using the
    // wrong M/D vs D/M assumption. This only affects CSV/TXT parsing — binary .xlsx/.xls
    // cell values keep their own stored types either way, so existing Excel imports are unaffected.
    reader.onload = (e)=>{ try{ resolve(XLSX.read(new Uint8Array(e.target.result), {type:'array', raw:true})); } catch(err){ reject(err); } };
    reader.onerror = ()=> reject(new Error('อ่านไฟล์ไม่สำเร็จ'));
    reader.readAsArrayBuffer(file);
  });
}
function excelSerialToIso(serial){
  const utcDays = Math.floor(serial) - 25569;
  const d = new Date(utcDays * 86400 * 1000);
  return `${d.getUTCFullYear()}-${String(d.getUTCMonth()+1).padStart(2,'0')}-${String(d.getUTCDate()).padStart(2,'0')}`;
}
function toIsoDate(v){
  if(v===null || v===undefined || v==='') return null;
  if(typeof v === 'number') return excelSerialToIso(v);
  if(v instanceof Date) return `${v.getUTCFullYear()}-${String(v.getUTCMonth()+1).padStart(2,'0')}-${String(v.getUTCDate()).padStart(2,'0')}`;
  const isoMatch = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(v));
  if(isoMatch) return `${isoMatch[1]}-${isoMatch[2]}-${isoMatch[3]}`;
  const d = new Date(v);
  if(isNaN(d)) return null;
  return `${d.getUTCFullYear()}-${String(d.getUTCMonth()+1).padStart(2,'0')}-${String(d.getUTCDate()).padStart(2,'0')}`;
}
// Matching an imported row's task-type text (e.g. "เปิดสาขาใหม่") against the coupon types
// configured in Settings used to be a strict === comparison — any stray leading/trailing
// space, doubled internal space, or invisible character (zero-width space/BOM, which can
// sneak in via copy-paste into a spreadsheet or a CSV export) silently fails the match and
// locks the plan's coupon count at 0, with no visible sign except the toast's "ไม่พบ
// ประเภทงานในระบบ" count. Normalizing both sides the same way before comparing removes that
// whole class of false negatives without weakening the check (a genuinely different type
// name still won't match).
function normalizeTypeName(s){
  return String(s||'').replace(/[​-‍﻿]/g,'').trim().replace(/\s+/g,' ');
}
function findCouponType(taskType){
  const norm = normalizeTypeName(taskType);
  if(!norm) return null;
  return state.couponTypes.find(t=>normalizeTypeName(t.name)===norm) || null;
}
// The "ตารางงานรายวัน" (daily schedule export) format gives dates as plain D/M/YYYY
// text, e.g. "1/10/2026" meaning 1 Oct 2026. new Date("1/10/2026") in JS parses this
// as M/D/Y (10 Jan) — silently wrong for most of the month — so it must be parsed
// explicitly here rather than falling through to toIsoDate()'s generic Date() fallback.
function parseDMYDate(v){
  if(v===null || v===undefined || v==='') return null;
  if(typeof v === 'number') return excelSerialToIso(v);
  if(v instanceof Date) return toIsoDate(v);
  const s = String(v).trim();
  const m = /^(\d{1,2})\/(\d{1,2})\/(\d{4})$/.exec(s);
  if(m){
    const day = parseInt(m[1],10), month = parseInt(m[2],10), year = parseInt(m[3],10);
    return `${year}-${String(month).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
  }
  return toIsoDate(v);
}
function normalizeHeader(h){ return String(h).trim().toLowerCase().replace(/\s+/g,''); }
function pickColumn(row, candidates){
  // Exact header match first (fast path).
  for(const key of candidates){ if(row[key] !== undefined && row[key] !== null && String(row[key]).trim() !== ''){ return String(row[key]).trim(); } }
  // Fallback: match ignoring case/extra whitespace in the source file's header row —
  // client files have used slightly different spellings/spacing for the same column
  // across imports, and a silent miss here leaves the field blank with no error shown,
  // which is hard for a non-technical user to notice or debug.
  const normCandidates = candidates.map(normalizeHeader);
  for(const rawKey of Object.keys(row)){
    if(normCandidates.includes(normalizeHeader(rawKey))){
      const v = row[rawKey];
      if(v !== undefined && v !== null && String(v).trim() !== '') return String(v).trim();
    }
  }
  return '';
}
function pickTeamColumn(row){
  const v = pickColumn(row, ['ทีม','ทีมที่ไปจัด','ทีมที่รับผิดชอบ','ทีมงาน','Team','ตำแหน่ง']);
  return v || null;
}
function findCouponTypeSheet(wb, excludeName){
  // Match by column headers (ประเภทงาน + จำนวนคูปอง) instead of a fixed sheet name,
  // since the sheet has been named differently across files ("จำนวนคูปอง", "แบ่งตามประเภทงาน", ...)
  for(const name of wb.SheetNames){
    if(name === excludeName) continue;
    const rows = XLSX.utils.sheet_to_json(wb.Sheets[name], {defval:null, raw:true, header:1});
    if(!rows.length) continue;
    const header = (rows[0]||[]).map(h=>String(h||'').trim());
    if(header.includes('ประเภทงาน') && header.includes('จำนวนคูปอง')) return name;
  }
  return null;
}

// Detects the daily-schedule export format (one row per team per day: ประเภท, รหัสสาขา,
// ชื่อสาขา, ประเภทแฟร์, ทีม, วันที่) as opposed to the older flat plan-list format
// (สาขา, วันที่เริ่มงาน, ...). The schedule export has no "วันที่เริ่มงาน" column at all,
// so that absence combined with the presence of "ประเภท"+"วันที่" is a safe signature.
function isScheduleExportFormat(rows){
  if(!rows.length) return false;
  const keys = Object.keys(rows[0]).map(normalizeHeader);
  const has = (h)=> keys.includes(normalizeHeader(h));
  return has('ประเภท') && has('วันที่') && has('ชื่อสาขา') && !has('วันที่เริ่มงาน');
}
// The schedule export labels teams "ทีม 1".."ทีม 16"; the employee roster (synced from
// the Google Sheet) labels the same 16 teams "SMA1".."SMA16". Map the former to the
// latter so an imported plan's team lines up with the employees already assigned to it —
// otherwise the plan would show a "ทีม 1" that matches none of the roster's teams, the
// exact class of mismatch already fixed once this project (see teamsList()/pickTeamColumn).
function mapScheduleTeamLabel(raw){
  const s = String(raw||'').trim();
  const m = /^ทีม\s*(\d+)$/.exec(s);
  return m ? ('SMA'+m[1]) : s;
}
// New daily-schedule-export importer: groups each team's rows (sorted by date) into
// contiguous same-branch blocks — a block is one branch "job" for that team, spanning
// its prep (วัน PR) + event (วันจัดงาน) days, ended by a travel/off row (blank branch) or
// a different branch code. Per the user's explicit request, a plan's start/end date is
// taken from ONLY the วันจัดงาน rows in the block, never the PR/travel/off days.
async function handleImportScheduleExportRows(rows){
  const byTeam = new Map();
  for(const r of rows){
    const teamRaw = pickColumn(r, ['ทีม']);
    const iso = parseDMYDate(r['วันที่'] !== undefined ? r['วันที่'] : pickColumn(r, ['วันที่']));
    if(!teamRaw || !iso) continue;
    const rec = {
      type: pickColumn(r, ['ประเภท']),
      branchCode: pickColumn(r, ['รหัสสาขา']),
      branchName: pickColumn(r, ['ชื่อสาขา']),
      fairType: pickColumn(r, ['ประเภทแฟร์']),
      date: iso,
    };
    if(!byTeam.has(teamRaw)) byTeam.set(teamRaw, []);
    byTeam.get(teamRaw).push(rec);
  }

  const existingKeys = new Set(state.plans.map(p=>`${p.branchCode}|${p.startDate}|${p.taskType}`));
  const toInsert = [];
  let skipped=0, noType=0, noEventDay=0;

  for(const [teamRaw, teamRows] of byTeam.entries()){
    teamRows.sort((a,b)=> a.date<b.date?-1:a.date>b.date?1:0);
    const team = mapScheduleTeamLabel(teamRaw);
    let i=0;
    while(i<teamRows.length){
      const code = teamRows[i].branchCode;
      if(!code){ i++; continue; } // travel/off day between blocks — not part of any plan
      let j=i;
      const block=[];
      while(j<teamRows.length && teamRows[j].branchCode===code){ block.push(teamRows[j]); j++; }
      i=j;
      const eventDays = block.filter(r=>r.type==='วันจัดงาน');
      if(eventDays.length===0){ noEventDay++; continue; }
      const startDate = eventDays.reduce((min,r)=> r.date<min?r.date:min, eventDays[0].date);
      const endDate = eventDays.reduce((max,r)=> r.date>max?r.date:max, eventDays[0].date);
      const taskType = block[0].fairType || '';
      const key = `${code}|${startDate}|${taskType}`;
      if(existingKeys.has(key)){ skipped++; continue; }
      existingKeys.add(key);
      const typeInfo = findCouponType(taskType);
      if(!typeInfo) noType++;
      toInsert.push({ code, branchName: block[0].branchName||'', taskType, startDate, endDate, total: typeInfo?typeInfo.count:0, team });
    }
  }

  let added=0;
  for(const p of toInsert){
    const id = 'p_'+Date.now().toString(36)+Math.random().toString(36).slice(2,7)+added;
    const { error: e1 } = await sb.from('plans').insert({
      id, name: p.branchName, branch_code: p.code, province: '',
      task_type: p.taskType||'ไม่ระบุ', total_coupons: p.total, team: p.team,
      needs_burmese: false, start_date: p.startDate, end_date: p.endDate,
      archived:false,
    });
    if(e1){ console.error(e1); continue; }
    if(p.total>0){
      const couponRows = Array.from({length:p.total},(_,i)=>({plan_id:id, no:i+1, owner:null, destroyed:false}));
      const { error: e2 } = await sb.from('coupons').insert(couponRows);
      if(e2) console.error(e2);
    }
    added++;
  }

  await loadAllData();
  closeModal();
  let msg = `นำเข้า ${added} แผนงานใหม่จากไฟล์ตารางงานรายวัน (นับวันที่จากวันจัดงานเท่านั้น)`;
  if(skipped) msg += ` — ข้าม ${skipped} รายการซ้ำ`;
  if(noType) msg += ` — ${noType} รายการไม่พบประเภทงานในระบบ ถูกล็อคที่ 0 ใบ`;
  if(noEventDay) msg += ` — ข้าม ${noEventDay} ช่วงที่ไม่มี "วันจัดงาน"`;
  showToast(msg); render();
}

async function handleImportPlansFile(file){
  try{
    const wb = await readWorkbook(file);
    const planSheetName = wb.SheetNames.find(n=>n.trim()==='แผนงาน') || wb.SheetNames[0];
    const planRows = XLSX.utils.sheet_to_json(wb.Sheets[planSheetName], {defval:null, raw:true});

    if(isScheduleExportFormat(planRows)){
      await handleImportScheduleExportRows(planRows);
      return;
    }

    const typeSheetName = findCouponTypeSheet(wb, planSheetName);

    if(typeSheetName){
      const typeRows = XLSX.utils.sheet_to_json(wb.Sheets[typeSheetName], {defval:null, raw:true});
      for(const r of typeRows){
        const tname=(r['ประเภทงาน']||'').toString().trim(); const tcount=parseInt(r['จำนวนคูปอง'],10);
        if(!tname || !tcount) continue;
        await sb.from('coupon_types').upsert({name:tname, count:tcount}, {onConflict:'name'});
        const existing = state.couponTypes.find(t=>t.name===tname);
        if(existing) existing.count = tcount; else state.couponTypes.push({name:tname, count:tcount});
      }
    }

    const existingKeys = new Set(state.plans.map(p=>`${p.branchCode}|${p.startDate}|${p.taskType}`));
    let added=0, skipped=0, noType=0, withTeam=0;
    for(const row of planRows){
      const branchName = (row['สาขา']||'').toString().trim(); if(!branchName) continue;
      const branchCode = (row['รหัสสาขา']||'').toString().trim();
      const taskType = (row['ประเภทงาน']||'').toString().trim();
      const startDate = toIsoDate(row['วันที่เริ่มงาน']);
      const key = `${branchCode}|${startDate}|${taskType}`;
      if(existingKeys.has(key)){ skipped++; continue; }
      const typeInfo = findCouponType(taskType);
      if(!typeInfo) noType++;
      const total = typeInfo ? typeInfo.count : 0;
      const burmeseRaw = (row['ชาวพม่า']||'').toString().trim();
      const team = pickTeamColumn(row);
      if(team) withTeam++;
      const id = 'p_'+Date.now().toString(36)+Math.random().toString(36).slice(2,7)+added;
      const { error: e1 } = await sb.from('plans').insert({
        id, name: branchName, branch_code: branchCode, province: (row['จังหวัด']||'').toString().trim(),
        task_type: taskType||'ไม่ระบุ', total_coupons: total, team,
        needs_burmese: burmeseRaw!=='' && burmeseRaw!=='-', start_date: startDate, end_date: toIsoDate(row['วันที่จบงาน']),
        archived:false,
      });
      if(e1){ console.error(e1); continue; }
      if(total>0){
        const rows = Array.from({length: total}, (_,i)=>({plan_id:id, no:i+1, owner:null, destroyed:false}));
        const { error: e2 } = await sb.from('coupons').insert(rows);
        if(e2) console.error(e2);
      }
      existingKeys.add(key); added++;
    }
    await loadAllData();
    closeModal();
    let msg = `นำเข้า ${added} แผนงานใหม่`;
    if(withTeam) msg += ` (พบคอลัมน์ทีม กำหนดทีมอัตโนมัติให้ ${withTeam} รายการ)`;
    if(skipped) msg += ` — ข้าม ${skipped} รายการซ้ำ`;
    if(noType) msg += ` — ${noType} รายการไม่พบประเภทงานในระบบ ถูกล็อคที่ 0 ใบ`;
    showToast(msg); render();
  }catch(err){ state.modalError = 'อ่านไฟล์ไม่สำเร็จ: '+err.message; render(); }
}

// Shared by both the manual Excel import and the live Google Sheet sync, so the two paths
// never drift apart on which header names they recognize (they did, once — the roster
// sheet's real header is "ทีมปัจจุบัน", which wasn't in the old candidate list at all,
// silently leaving every employee's team blank).
function mapEmployeeRow(r){
  return {
    team: pickColumn(r, ['ทีม','ทีมปัจจุบัน','ทีมที่ไปจัด','ทีมที่รับผิดชอบ','ทีมงาน','Team','ตำแหน่ง']),
    area: pickColumn(r, ['Area','Areaดูแล','area','พื้นที่']),
    code: pickColumn(r, ['รหัสพนักงาน']),
    name: pickColumn(r, ['ชื่อพนักงาน']),
    nickname: pickColumn(r, ['ชื่อเล่น']),
    gender: pickColumn(r, ['เพศ']),
    address: pickColumn(r, ['ที่อยู่']),
    coordinates: pickColumn(r, ['พิกัด']),
    phone: pickColumn(r, ['เบอร์โทร','เบอร์โทรศัพท์']),
  };
}
// Full-replace the employees table (delete-all + re-insert) with a freshly mapped list —
// shared commit step for both the Excel-file import and the Google Sheet sync below.
async function replaceEmployees(emps){
  if(emps.length===0) throw new Error('ไม่พบข้อมูลพนักงาน (ตรวจสอบว่ามีคอลัมน์ "ชื่อพนักงาน")');
  const { error: delErr } = await sb.from('employees').delete().not('id','is',null);
  if(delErr) console.error(delErr);
  const { error: insErr } = await sb.from('employees').insert(emps);
  if(insErr) throw new Error(insErr.message+' — ถ้าฟิลด์ใหม่ (ที่อยู่/พิกัด/เบอร์โทร) ยังไม่มีในตาราง ให้รัน SQL เพิ่มคอลัมน์ก่อน');
  state.employees = emps;
}

async function handleImportEmployeesFile(file){
  try{
    const wb = await readWorkbook(file);
    const sheet = wb.Sheets[wb.SheetNames[0]];
    const rows = XLSX.utils.sheet_to_json(sheet, {defval:null, raw:true});
    const emps = rows.map(mapEmployeeRow).filter(e=>e.name);
    await replaceEmployees(emps);
    closeModal(); showToast(`นำเข้ารายชื่อพนักงาน ${emps.length} คนเรียบร้อย (แทนที่รายชื่อเดิมทั้งหมด)`); render();
  }catch(err){ state.modalError = 'อ่านไฟล์ไม่สำเร็จ: '+err.message; render(); }
}

// Live sync: pull the roster straight from the "รายชื่อพนักงานทีมกิจ" Google Sheet (shared
// as "Anyone with the link: Viewer") via its public gviz CSV export — no API key needed,
// consistent with the rest of this app's no-login, talk-to-the-backend-directly design.
// Runs automatically on every page load (see init()) and can also be triggered on demand
// from the "นำเข้ารายชื่อพนักงาน" dialog. A failure here (network hiccup, sheet unshared,
// gid/tab changed) never breaks the rest of the app — it just keeps whatever roster was
// last synced successfully and records the error for display in that dialog.
async function syncEmployeesFromSheet(opts){
  opts = opts || {};
  state.employeeSync = {...state.employeeSync, status:'syncing'};
  if(!opts.silent) render();
  try{
    const res = await fetch(employeeSheetCsvUrl(), {cache:'no-store'});
    if(!res.ok) throw new Error('เปิด Google Sheet ไม่สำเร็จ (HTTP '+res.status+') — ตรวจสอบว่ายังแชร์เป็น "ทุกคนที่มีลิงก์ดูได้" อยู่');
    const csvText = await res.text();
    const wb = XLSX.read(csvText, {type:'string'});
    const sheet = wb.Sheets[wb.SheetNames[0]];
    const rows = XLSX.utils.sheet_to_json(sheet, {defval:null, raw:true});
    const emps = rows.map(mapEmployeeRow).filter(e=>e.name);
    await replaceEmployees(emps);
    state.employeeSync = { status:'ok', lastSyncedAt: Date.now(), error:null, count: emps.length };
    if(!opts.silent) showToast(`ซิงค์รายชื่อพนักงานจาก Google Sheet แล้ว (${emps.length} คน)`);
  }catch(err){
    console.error('syncEmployeesFromSheet failed', err);
    state.employeeSync = {...state.employeeSync, status:'error', error: err.message||String(err)};
    if(!opts.silent) showToast('ซิงค์จาก Google Sheet ไม่สำเร็จ: '+(err.message||err));
  }
  render();
}

/* ============ Photo handling ============ */
function resizeImageFile(file, maxDim, quality){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = (e)=>{
      const img = new Image();
      img.onload = ()=>{
        let w=img.width, h=img.height;
        if(w>h){ if(w>maxDim){ h=Math.round(h*maxDim/w); w=maxDim; } } else { if(h>maxDim){ w=Math.round(w*maxDim/h); h=maxDim; } }
        const canvas=document.createElement('canvas'); canvas.width=w; canvas.height=h;
        canvas.getContext('2d').drawImage(img,0,0,w,h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = ()=> reject(new Error('โหลดรูปไม่สำเร็จ'));
      img.src = e.target.result;
    };
    reader.onerror = ()=> reject(new Error('อ่านไฟล์รูปไม่สำเร็จ'));
    reader.readAsDataURL(file);
  });
}

/* ============ Excel export ============ */
function downloadXlsx(filename, sheetsObj){
  const wb = XLSX.utils.book_new();
  Object.entries(sheetsObj).forEach(([name, rows])=>{
    const ws = XLSX.utils.aoa_to_sheet(rows);
    XLSX.utils.book_append_sheet(wb, ws, name.slice(0,31));
  });
  XLSX.writeFile(wb, filename);
}

function renderHome(){
  const f = state.homeFilter;
  const types = [...new Set(state.plans.map(p=>p.taskType))].sort();
  const teams = teamsList();
  let list = state.plans.filter(p=>!p.archived);
  if(f.search){ const s=f.search.toLowerCase(); list = list.filter(p => (p.name+p.branchCode+p.province).toLowerCase().includes(s)); }
  if(f.type) list = list.filter(p=>p.taskType===f.type);
  if(f.status!=='all') list = list.filter(p=>planStatus(p)===f.status);
  if(f.team) list = list.filter(p=>p.team===f.team);
  function isClosedPlan(p){
    const remaining = p.totalCoupons - (p.assignedCount||0) - (p.destroyedCount||0);
    return remaining<=0 && (p.assignedCount||0)+(p.destroyedCount||0)>0;
  }
  list.sort((a,b)=>{
    const ca = isClosedPlan(a) ? 1 : 0, cb = isClosedPlan(b) ? 1 : 0;
    if(ca!==cb) return ca-cb; // closed plans sink to the bottom
    return (a.startDate||'9999').localeCompare(b.startDate||'9999');
  });
  const archived = state.plans.filter(p=>p.archived);

  const folder = p => {
    const status = planStatus(p);
    const pct = p.totalCoupons ? Math.min(100, Math.round((p.assignedCount||0)/p.totalCoupons*100)) : 0;
    const remaining = p.totalCoupons - (p.assignedCount||0) - (p.destroyedCount||0);
    const closed = remaining<=0 && (p.assignedCount||0)+(p.destroyedCount||0)>0;
    return `
    <div class="folder status-${closed?'closed':status}" data-act="open" data-id="${p.id}">
